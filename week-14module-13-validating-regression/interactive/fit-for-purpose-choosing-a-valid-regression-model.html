<title>Fit for Purpose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout (Fit for Purpose): engineering lab notebook — graph-paper ground, one centered work column, each test request is a form card followed by three stacked work panels. */
:root {
  --bg: #e8edf1; --grid: #d8e0e7; --surface: #fbfcfd; --sunk: #eef2f5; --ink: #14202a; --muted: #55636f; --line: #c4ced7;
  --accent: #1b5b8a; --accent-ink: #ffffff; --accent-soft: #dbe8f2;
  --reject: #d2561d; --reject-fill: rgba(210, 86, 29, .30);
  --ok: #2b7745; --ok-soft: #e0efe5; --no: #b0271f; --no-soft: #f7e2df;
  --m1: #1b5b8a; --m2: #c4501a; --m3: #2f7d4a; --m4: #7a3fa0; --part: #9a6a00; --part-soft: #f6ecd2;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1318; --grid: #16202a; --surface: #141d25; --sunk: #1a2530; --ink: #e1e8ee; --muted: #93a2af; --line: #2b3946;
  --accent: #70b1e2; --accent-ink: #08131c; --accent-soft: #19304a;
  --reject: #f08743; --reject-fill: rgba(240, 135, 67, .30);
  --ok: #6cc38a; --ok-soft: #16301f; --no: #f1817a; --no-soft: #3a1c1a; --m1: #70b1e2; --m2: #f08743; --m3: #6cc38a; --m4: #c49be6; --part: #e2b44a; --part-soft: #3a2f12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1318; --grid: #16202a; --surface: #141d25; --sunk: #1a2530; --ink: #e1e8ee; --muted: #93a2af; --line: #2b3946;
  --accent: #70b1e2; --accent-ink: #08131c; --accent-soft: #19304a;
  --reject: #f08743; --reject-fill: rgba(240, 135, 67, .30);
  --ok: #6cc38a; --ok-soft: #16301f; --no: #f1817a; --no-soft: #3a1c1a; --m1: #70b1e2; --m2: #f08743; --m3: #6cc38a; --m4: #c49be6; --part: #e2b44a; --part-soft: #3a2f12; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  margin: 0; background-color: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.05; text-wrap: balance; margin: 0; letter-spacing: .01em; }
sub, sup { font-size: .7em; line-height: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg); }
.bar-in { max-width: 920px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 10px; align-items: center; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
.glyph { text-transform: none; font-family: var(--f-mono); font-size: 12px; font-weight: 600; border: 1.5px solid currentColor; padding: 1px 6px; border-radius: 3px; letter-spacing: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); white-space: nowrap; }
.chip.score { background: var(--bg); color: var(--ink); border-color: var(--bg); font-weight: 600; }
.chip.hint-on { border-color: var(--reject); }

.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
.eyebrow { font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.small { font-size: 13px; color: var(--muted); margin: 0; }
.err { color: var(--no); font-weight: 500; margin: 0; }

/* start */
.start { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: start; padding-top: 12px; }
.start-copy { min-width: 0; }
.start h1 { font-size: clamp(52px, 9vw, 92px); text-transform: uppercase; letter-spacing: .005em; }
.lede { font-size: 17px; max-width: 34em; margin: 14px 0 18px; }
.hero-svg { width: 100%; max-width: 520px; height: auto; display: block; }
.start-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 14px; min-width: 0; }
.start-card h2 { font-size: 26px; text-transform: uppercase; }
.rules { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld > span { font: 600 13px/1.2 var(--f-mono); letter-spacing: .02em; color: var(--muted); }
.fld > span em { text-transform: none; letter-spacing: 0; font-weight: 400; font-style: normal; }
input[type=text], select { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); min-height: 42px; }
input[type=text]:disabled, select:disabled { opacity: .75; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: var(--r); cursor: pointer; font-weight: 600; min-height: 42px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn.danger { background: var(--no); color: var(--surface); border-color: var(--no); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* play */
.play { display: grid; gap: 18px; }
.progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.progress i { height: 6px; background: var(--line); border-radius: 2px; }
.progress i.done { background: var(--accent); }
.progress i.now { background: var(--reject); }
.request { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.req-strip { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 9px 18px; background: var(--sunk); border-bottom: 1px dashed var(--line); color: var(--muted); }
.request h2 { font-size: clamp(28px, 5vw, 38px); text-transform: uppercase; padding: 16px 18px 0; }
.request p { margin: 10px 18px 18px; font-size: 16px; max-width: 46em; }

.part { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; scroll-margin-top: 70px; }
.phead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: flex-end; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.pnum { font: 600 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.phead h3 { font-size: 26px; text-transform: uppercase; margin-top: 4px; }
.pright { display: flex; gap: 10px; align-items: center; }
.ptag { font: 500 12px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 8px; white-space: nowrap; }
.earned { font: 600 18px/1 var(--f-mono); }
.hintbox { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }

.grid1 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.preview { grid-column: 1 / -1; }
#hypPrev, .key { font-family: var(--f-mono); font-size: 17px; }
#hypPrev { background: var(--sunk); border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 4px 32px; }
.hyp { white-space: nowrap; }
.hl { color: var(--muted); }
.q { color: var(--no); }
.hyp .q { color: var(--muted); }

.seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; width: fit-content; max-width: 100%; }
.segopt { position: relative; }
.segopt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.segopt span { display: block; padding: 9px 16px; min-width: 52px; text-align: center; font: 500 15px/1.3 var(--f-mono); background: var(--sunk); border-right: 1px solid var(--line); cursor: pointer; }
.segopt:last-child span { border-right: 0; }
.segopt input:checked + span { background: var(--accent); color: var(--accent-ink); }
.segopt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -3px; }
.segopt input:disabled + span { cursor: default; }

.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); cursor: pointer; }
.choice input { margin-top: 4px; accent-color: var(--accent); flex: none; }
.choice span { min-width: 0; }
.choice:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: none; }
.choice.wrong { border-color: var(--no); background: var(--no-soft); box-shadow: none; }
.q > .ql { color: var(--ink); margin-bottom: 8px; }
div.q { color: inherit; }

.feedback { display: grid; gap: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
.fb { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.fb li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: var(--r); }
.fb li.ok { background: var(--ok-soft); }
.fb li.no { background: var(--no-soft); }
.fb .mk { font-weight: 700; }
.fb li.ok .mk { color: var(--ok); }
.fb li.no .mk { color: var(--no); }
.fb .fp { font: 500 13px var(--f-mono); }
.fb .fn { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
.key { background: var(--sunk); border-left: 3px solid var(--ok); padding: 10px 14px; display: grid; gap: 2px; }
.keyl, .keym { font: 600 12px/1.4 var(--f-mono); letter-spacing: .03em; color: var(--muted); }
.keym { margin-top: 4px; }
.why { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; max-width: 60em; }
.tally { display: flex; justify-content: space-between; align-items: baseline; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: var(--r); font-family: var(--f-mono); }
.tally b { font-size: 22px; }

.figure { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface); min-width: 0; }
.figl { font: 600 13px/1.2 var(--f-mono); letter-spacing: .02em; color: var(--muted); margin-bottom: 6px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 14px; height: 10px; display: inline-block; border-radius: 2px; }
.sw-dot { background: var(--accent); border-radius: 50%; width: 10px; }
.sw-band { background: var(--accent-soft); }
.sw-ref { border-top: 2px dashed var(--muted); height: 0; }
.sw-rej { background: var(--reject-fill); border: 1px solid var(--reject); }
.sw-stat { background: var(--accent); width: 3px; height: 14px; }
.sw-p { background: repeating-linear-gradient(45deg, var(--accent) 0 2px, transparent 2px 5px); }

.c-curve { fill: none; stroke: var(--ink); stroke-width: 2; }
.c-under { fill: var(--sunk); }
.c-rej { fill: var(--reject-fill); stroke: none; }
.c-p { fill: url(#hatch); stroke: var(--accent); stroke-width: 1; }
.c-hbg { fill: transparent; }
.c-hline { stroke: var(--accent); stroke-width: 2.2; }
.c-axis { stroke: var(--muted); stroke-width: 1; }
.c-tick { fill: var(--muted); font: 12px var(--f-mono); }
.c-crit { stroke: var(--reject); stroke-width: 1.5; stroke-dasharray: 4 3; }
.c-critl { fill: var(--reject); font: 600 13px var(--f-mono); }
.c-stat { stroke: var(--accent); stroke-width: 3; }
.c-statl { fill: var(--accent); font: 600 14px var(--f-mono); }
.c-dot { fill: var(--accent); fill-opacity: .72; stroke: var(--surface); stroke-width: 1; }
.c-band { fill: var(--accent-soft); }
.c-mean { stroke: var(--ink); stroke-width: 2.5; }
.c-val { fill: var(--ink); font: 500 12.5px var(--f-mono); }
.c-row { fill: var(--muted); font: 600 12px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.c-ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.c-refl { fill: var(--muted); font: 500 12px var(--f-mono); }
.c-bar { fill: var(--accent); fill-opacity: .8; }

.results { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; align-content: start; }
.kv { background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; display: grid; gap: 2px; min-width: 0; }
.kv span { font-size: 12px; color: var(--muted); }
.kv b { font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.bignums { display: grid; gap: 10px; align-content: start; }
.bn { background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 2px; }
.bn span { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.bn b { font: 600 22px var(--f-mono); font-variant-numeric: tabular-nums; }

.raw { margin-top: 8px; font-size: 13px; }
.raw summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.rawg { margin-top: 8px; }
.rawl { font: 600 12px var(--f-mono); color: var(--muted); }
.rawv { font: 13px/1.6 var(--f-mono); word-break: break-word; user-select: all; }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rawt { margin-top: 8px; font: 13px var(--f-mono); }
.rawt th, .rawt td { padding: 4px 12px; border-bottom: 1px solid var(--line); text-align: right; }

/* report */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: grid; gap: 20px; }
.rep-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
.rep-name { font-size: clamp(34px, 6vw, 52px); text-transform: uppercase; }
.rep-meta { margin: 6px 0 0; color: var(--muted); }
.rep-score { font-family: var(--f-display); display: flex; align-items: baseline; gap: 6px; }
.rep-score b { font-size: 84px; line-height: .9; color: var(--accent); }
.rep-score span { font-size: 26px; font-weight: 600; color: var(--muted); }
table.rep { width: 100%; font-size: 14px; min-width: 640px; }
.rep th { font: 600 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
.rep td { padding: 8px; border-bottom: 1px solid var(--line); }
.rep .n { text-align: right; font-family: var(--f-mono); }
.rep tfoot td { border-bottom: 0; font-weight: 600; padding-top: 12px; }
.rep-foot { display: grid; gap: 12px; }
.code { font-family: var(--f-mono); font-size: 14px; }
.code b { font-size: 18px; letter-spacing: .12em; background: var(--sunk); padding: 3px 8px; border-radius: 4px; }


/* gate + cheat sheet */
.gate { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 22px; display: grid; gap: 12px; }
.gate h2 { font-size: clamp(28px, 5vw, 38px); text-transform: uppercase; }
.gate p { margin: 0; max-width: 46em; }
html.locked, html.locked body { overflow: hidden; }
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 55%, transparent); display: flex; justify-content: center; align-items: stretch; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 980px; border-radius: var(--r); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sheet-head { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: flex-end; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: clamp(26px, 4.5vw, 34px); text-transform: uppercase; }
.jumps { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px; border-bottom: 1px dashed var(--line); background: var(--sunk); }
.sheet-body { overflow-y: auto; padding: 4px 20px 20px; display: grid; gap: 8px; min-height: 0; flex: 1; }
.sheet-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }
.cs { padding-top: 16px; display: grid; gap: 10px; scroll-margin-top: 8px; }
.cs + .cs { border-top: 1px solid var(--line); }
.cs h3 { font-size: 24px; text-transform: uppercase; color: var(--accent); }
.cs h4 { font: 600 15px/1.3 var(--f-body); margin: 0 0 6px; }
.cs p, .cs ul { margin: 0; font-size: 14.5px; max-width: 62em; }
.cs ul { padding-left: 20px; display: grid; gap: 5px; }
.cs2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px; }
.cs2 > div { min-width: 0; display: grid; gap: 8px; align-content: start; }
.cst { width: 100%; font-size: 14px; }
.cst th { font: 600 12px var(--f-mono); color: var(--muted); text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cst td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cst td.sym { font: 600 15px var(--f-mono); white-space: nowrap; color: var(--accent); }
.cst.num td { font-family: var(--f-mono); }
.mono { font-family: var(--f-mono); font-size: 13.5px; }
td.mono { min-width: 140px; }
.note { background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; }
.tails { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tails figure { margin: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 10px; background: var(--sunk); display: grid; gap: 6px; }
.tails figcaption { font-size: 13px; }
.mini { width: 100%; height: auto; display: block; }
.sheetnote { margin-top: -4px; }
@media (max-width: 760px) {
  .cs2, .tails { grid-template-columns: 1fr; }
  .overlay { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  .sheet { border-radius: 0; border: 0; }
  .sheet-head, .jumps, .sheet-body, .sheet-foot { padding-left: 16px; padding-right: 16px; }
  .sheet-head #sheetClose { display: none; }
}

/* regression game */
.vars { display: flex; flex-wrap: wrap; gap: 4px 24px; font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.request p.vars { margin-top: -6px; }
.rawwrap { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 14px; align-items: start; }
.dtable { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }
.dtable .rawt { margin: 0; width: 100%; }
.dtable th { position: sticky; top: 0; background: var(--sunk); }
.togs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.tog { position: relative; display: block; cursor: pointer; }

  if (cur.hints[k] !== null || locked) return '';
  return `<button class="btn ghost sm" data-act="hint" data-k="${k}" type="button">Hint · ${S.freeHints ? 'free' : '−1 pt'}</button>`;
}
function hintBox(cur, k) { return cur.hints[k] === null ? '' : `<div class="hintbox"><b>Hint${cur.hints[k] ? ' (−1 pt)' : ' (free)'}.</b> ${HINTS[k]}</div>`; }
function partHead(n, title, pts, cur, locked, earned) {
  return `<div class="phead"><div><span class="pnum">Part ${n}</span><h3>${title}</h3></div><div class="pright">${earned !== undefined ? `<span class="earned">${fmtPts(earned)} / ${pts}</span>` : `<span class="ptag">${pts} pts</span>`}${hintBtn(cur, n, locked)}</div></div>`;
}
function fbList(items) {
  return `<ul class="fb">${items.map(i => `<li class="${i.ok === true ? 'ok' : i.ok === 'part' ? 'part' : 'no'}"><span class="mk" aria-hidden="true">${i.ok === true ? '✓' : i.ok === 'part' ? '◐' : '✗'}</span><span class="fk">${i.k}</span><span class="fp">${fmtPts(i.got)} / ${fmtPts(i.pts)}</span>${i.note ? `<span class="fn">${i.note}</span>` : ''}</li>`).join('')}</ul>`;
}
function progressBar() { return `<div class="progress" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i class="${i < S.idx ? 'done' : i === S.idx ? 'now' : ''}"></i>`).join('')}</div>`; }
function tierWord(t) { return t === 'best' ? 'best' : t === 'good' ? 'good' : 'poor'; }
function whyModel(d, k) {
  const f = d.fits[k], parts = [];
  if (!f.defined) parts.push('back-transformed curve is undefined over the data (1/y fit crosses zero)');
  if (f.patterned && f.defined) parts.push('residual pattern');
  if (f.nonsig) parts.push('non-significant term (p > 0.05)');
  if (!parts.length) parts.push(`valid, s = ${fmtSig(f.s, 4)}`);
  return parts.join('; ');
}

// ---------- start ----------
function heroArt() {
  const W = 520, H = 180, pts = [];
  for (let i = 0; i < 14; i++) { const x = 0.4 + i * 0.36; const jit = [0.06, -0.08, 0.03, 0.1, -0.05, 0.02, -0.09, 0.07, -0.02, 0.05, -0.06, 0.04, -0.03, 0.01][i]; pts.push([x, 3.2 * Math.exp(-0.42 * x) + 0.6 + jit]); }
  const sx = x => 20 + x / 5.4 * (W - 40), sy = y => H - 22 - y / 4 * (H - 40);
  let lin = `M${sx(0.2)},${sy(3.0)} L${sx(5.3)},${sy(0.55)}`, cur = '';
  for (let i = 0; i <= 80; i++) { const x = 0.2 + 5.1 * i / 80; cur += `${i ? 'L' : 'M'}${sx(x).toFixed(1)},${sy(3.2 * Math.exp(-0.42 * x) + 0.6).toFixed(1)} `; }
  return `<svg viewBox="0 0 ${W} ${H}" class="hero-svg" aria-hidden="true"><line class="c-axis" x1="20" x2="${W - 20}" y1="${H - 22}" y2="${H - 22}"/><line class="c-axis" x1="20" x2="20" y1="10" y2="${H - 22}"/><path class="c-fit m2" d="${lin}"/><path class="c-fit m1" d="${cur}"/>${pts.map(p => `<circle class="c-dot" cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="4.5"/>`).join('')}</svg>`;
}

// ---------- parts ----------
function part1(sc, cur) {
  const d = cur.data, g = cur.g1, locked = !!g, a = cur.a1;
  const opts = VIEW_KEYS.map(v => `<label class="tog"><input type="checkbox" name="f-view" value="${v}" ${a.views.includes(v) ? 'checked' : ''} ${locked ? 'disabled' : ''}><span><b>${VIEWS[v].name}</b><em>${v === 'res_lin' ? 'shows curvature a line misses' : 'straight if the ' + MODELS[VIEWS[v].for[0]].name.toLowerCase() + ' model fits'}</em></span></label>`).join('');
  let views = '', fb = '';
  if (locked) {
    const bv = viewFor(d.best), show = a.views.slice(); if (!show.includes(bv)) show.push(bv);
    views = `<div class="views">${show.map((v, i) => `<figure class="figure"><div class="figl">${esc(VIEWS[v].name)}${a.views.includes(v) ? '' : ' · <span class="missed">view you missed</span>'}</div>${viewChart(v, sc, d, i)}</figure>`).join('')}</div>
      <div class="legend"><span><i class="sw sw-dot"></i>transformed data</span><span><i class="sw sw-refl"></i>least-squares line on this view, for judging straightness</span></div>`;
    fb = `<div class="feedback">${fbList(g.items)}<ul class="why"><li>${g.note}</li></ul>${cur.hints[1] ? '<p class="small">Hint cost: −1 pt.</p>' : ''}</div>`;
  }
  return `<section class="part ${locked ? 'done' : ''}" id="p1">

    <div class="rawwrap"><figure class="figure"><div class="figl">Raw paired observations · n = ${d.xs.length}</div>${rawChart(sc, d, [])}</figure>${dataTable(sc, d)}</div>

    ${!locked ? `<p class="err" ${cur.err ? '' : 'hidden'}>${esc(cur.err)}</p><div class="actions"><button class="btn primary" data-act="sub1" type="button">Generate views</button></div>` : views + fb}

function statsTable(sc, d, keys, ref) {
  return `<div class="tscroll"><table class="stats"><thead><tr><th>Model</th><th>Fit on</th><th>Fitted equation</th><th class="n">R²</th><th class="n">adj R²</th><th class="n">s (${esc(sc.y.unit)})</th><th class="n">Term p-values</th></tr></thead><tbody>${keys.map((k, i) => {

}

function part2(sc, cur) {
  if (cur.part < 2) return '';

  let body = `<div class="q"><div class="ql"><b>2a.</b> Shortlist the models to fit. Choose two to four.</div><div class="togs">${shortOpts}</div></div>`;
  if (!cur.fitted) {
    return `<section class="part" id="p2">${partHead(2, 'Shortlist and eliminate', 5, cur, false)}${hintBox(cur, 2)}${body}

  }
  const keys = a.short;

  body += `<div class="views">${keys.map((k, i) => `<figure class="figure"><div class="figl"><span class="key-sw ${SLOT[i]}"></span>Residuals · ${esc(MODELS[k].name)}</div>${residChart(k, sc, d, i)}</figure>`).join('')}</div>`;
  const ref = locked ? bestOf(d.fits, keys) : null;

  }
  return `<section class="part ${locked ? 'done' : ''}" id="p2">${partHead(2, 'Shortlist and eliminate', 5, cur, locked, g ? partScore(g, cur, 2) : undefined)}${hintBox(cur, 2)}${body}

}

      <div class="tally"><span>Data set ${S.idx + 1} total</span><b>${fmtPts(tot)} / 10</b></div>
      <div class="actions"><button class="btn primary" data-act="next" type="button">${S.idx < 9 ? 'Next data set' : 'See my score report'}</button></div></div>`;
  }

    <div class="q"><div class="ql"><b>3.</b> Which model do you recommend to the engineer? Choose from the models you kept.</div><div class="choices">${opts}</div></div>
    ${!locked ? `<p class="err" ${cur.err ? '' : 'hidden'}>${esc(cur.err)}</p><div class="actions"><button class="btn primary" data-act="sub3" type="button">Submit final model</button></div>` : fb}</section>`;
}

// ---------- cheat sheet ----------
function residMini(kind) {
  const W = 200, H = 90, pts = [];
  const jit = [0.3, -0.5, 0.8, -0.2, 0.6, -0.9, 0.1, 0.7, -0.6, 0.4, -0.3, 0.9, -0.7, 0.2, -0.4, 0.5];
  for (let i = 0; i < 16; i++) { const u = i / 15; let r = jit[i] * 0.6; if (kind === 'curve') r = 2.2 * (u - 0.5) ** 2 * 4 - 1.1 + jit[i] * 0.25; if (kind === 'funnel') r = jit[i] * (0.15 + 1.6 * u); pts.push([u, r]); }
  const sx = u => 10 + u * (W - 20), sy = r => H / 2 - r * (H / 2 - 10) / 1.4;
  return `<svg viewBox="0 0 ${W} ${H}" class="mini" aria-hidden="true"><line class="c-zero" x1="6" x2="${W - 6}" y1="${H / 2}" y2="${H / 2}"/>${pts.map(p => `<circle class="c-dot" cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="3.5"/>`).join('')}</svg>`;
}
const SHAPES = [
  { k: 'lin', eq: 'y = a + bx', fn: (x, a, b) => a + b * x, x: [0, 4], A: 1, B: 0.6 },
  { k: 'quad', eq: 'y = ax + bx²', fn: (x, a, b) => a * x + b * x * x, x: [0, 4], A: 2, B: 0.8 },
  { k: 'log', eq: 'y = a + b ln x', fn: (x, a, b) => a + b * Math.log(x), x: [0.08, 4], A: 1.5, B: 1 },
  { k: 'pow', eq: 'y = a·xᵇ', fn: (x, a, b) => a * Math.pow(x, b), x: [0.1, 4], A: 1, B: 1.6, Bn: 1, cap: 8 },
  { k: 'exp', eq: 'y = a·eᵇˣ', fn: (x, a, b) => a * Math.exp(b * x), x: [0, 4], A: 1, B: 0.6 },
  { k: 'rx', eq: 'y = a + b/x', fn: (x, a, b) => a + b / x, x: [0.15, 4], A: 1.5, B: 1, cap: 6 },
  { k: 'ry', eq: 'y = 1 / (a + bx)', fn: (x, a, b) => 1 / (a + b * x), x: [0, 4], A: 1, B: 0.5, cap: 5, asym: (a, b) => -a / b },
];
function shapeMini(sh, sa, sb) {
  const a = sa * sh.A, b = sb * (sb < 0 && sh.Bn ? sh.Bn : sh.B);
  const W = 150, H = 104, P = 8, [x0, x1] = sh.x, N = 160, cap = sh.cap || 1e9;
  const pts = []; for (let i = 0; i <= N; i++) { const x = x0 + (x1 - x0) * i / N; const y = sh.fn(x, a, b); pts.push([x, isFinite(y) && Math.abs(y) <= cap ? y : NaN]); }
  const ys = pts.map(p => p[1]).filter(isFinite).concat([0]);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0 || 1) * 0.1; y0 -= pad; y1 += pad;
  const sx = x => P + (x - Math.min(0, x0)) / (x1 - Math.min(0, x0)) * (W - 2 * P), sy = y => H - P - (y - y0) / (y1 - y0) * (H - 2 * P);
  let d = '', pen = false, prev = null;
  pts.forEach(p => { if (!isFinite(p[1]) || (prev !== null && Math.sign(p[1]) !== Math.sign(prev) && Math.abs(p[1] - prev) > (y1 - y0) * 0.5)) { pen = false; prev = isFinite(p[1]) ? p[1] : null; if (!isFinite(p[1])) return; } d += `${pen ? 'L' : 'M'}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)} `; pen = true; prev = p[1]; });
  let asym = '';
  if (sh.asym) { const xa = sh.asym(a, b); if (xa > x0 && xa < x1) asym = `<line class="c-asym" x1="${sx(xa).toFixed(1)}" x2="${sx(xa).toFixed(1)}" y1="${P}" y2="${H - P}"/>`; }
  if (sh.k === 'rx') { const X = sx(0); asym += `<line class="c-asym" x1="${P}" x2="${W - P}" y1="${sy(a).toFixed(1)}" y2="${sy(a).toFixed(1)}"/>`; }
  const X0 = sx(0), Y0 = sy(0);
  return `<figure class="shape"><svg viewBox="0 0 ${W} ${H}" class="mini" role="img" aria-label="${MODELS[sh.k].name} with a ${sa > 0 ? 'positive' : 'negative'} and b ${sb > 0 ? 'positive' : 'negative'}"><line class="c-axis" x1="${P}" x2="${W - P}" y1="${Y0.toFixed(1)}" y2="${Y0.toFixed(1)}"/><line class="c-axis" x1="${X0.toFixed(1)}" x2="${X0.toFixed(1)}" y1="${P}" y2="${H - P}"/>${asym}<path class="c-fit m1" d="${d}"/></svg><figcaption>a ${sa > 0 ? '+' : '−'}, b ${sb > 0 ? '+' : '−'}</figcaption></figure>`;
}
function shapeGallery() {
  const combos = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  return `<div class="shapes"><div class="shape-head"><span></span>${combos.map(c => `<span>(${c[0] > 0 ? '+' : '−'}, ${c[1] > 0 ? '+' : '−'})</span>`).join('')}</div>${SHAPES.map(sh => `<div class="shape-row"><div class="shape-lab"><b>${MODELS[sh.k].name}</b><span class="mono">${sh.eq}</span></div>${combos.map(c => shapeMini(sh, c[0], c[1])).join('')}</div>`).join('')}</div>`;
}
function cheatSheet() {
  return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <div class="sheet-head">
      <div><p class="eyebrow">Before data set ${S.idx + 1} of 10</p><h2 id="sheetTitle">Regression Model Selection Cheat Sheet</h2></div>
      <div class="actions"><button class="btn ghost" data-act="sheet-print" type="button">Print cheat sheet</button><button class="btn primary" id="sheetClose" data-act="sheet-close" type="button">Close and start data set</button></div>
    </div>
    <p class="printnote" id="printNote" hidden>Printing is blocked inside the hosted viewer. Open the standalone copy of Fit for Purpose (the downloadable HTML file) in your browser and use Print cheat sheet there.</p>
    <nav class="jumps" aria-label="Cheat sheet sections">
      <button class="btn ghost sm" data-act="jump" data-to="cs-models" type="button">The seven models</button>
      <button class="btn ghost sm" data-act="jump" data-to="cs-shapes" type="button">Model shapes</button>
      <button class="btn ghost sm" data-act="jump" data-to="cs-explore" type="button">Exploring the data</button>
      <button class="btn ghost sm" data-act="jump" data-to="cs-stats" type="button">Comparison statistics</button>
      <button class="btn ghost sm" data-act="jump" data-to="cs-rules" type="button">Elimination rules</button>
    </nav>
    <div class="sheet-body">
    <section class="cs" id="cs-models">
      <h3>The seven models</h3>
      <p>Each model becomes a straight line (or, for the quadratic, a multiple regression) after the transformation shown. Least squares is run on the transformed values, then the result is converted back to y.</p>
      <div class="tscroll"><table class="cst">
        <thead><tr><th>Model</th><th>Equation</th><th>Fit by regressing</th><th>Shape clues in the raw scatter</th><th>Requires</th></tr></thead>
        <tbody>
          <tr><td class="sym">Linear</td><td class="mono">y = b₀ + b₁x</td><td class="mono">y on x</td><td>Constant slope; points scatter evenly around a straight line.</td><td>—</td></tr>
          <tr><td class="sym">Quadratic</td><td class="mono">y = b₀ + b₁x + b₂x²</td><td class="mono">y on x and x²</td><td>One bend: a peak, a valley, or a curve that steepens or flattens. The x² term must be significant.</td><td>—</td></tr>
          <tr><td class="sym">Logarithmic</td><td class="mono">y = b₀ + b₁ ln x</td><td class="mono">y on ln x</td><td>Rises (or falls) quickly at small x, then keeps changing slowly with no upper limit.</td><td>x &gt; 0</td></tr>
          <tr><td class="sym">Power</td><td class="mono">y = a·xᵇ</td><td class="mono">ln y on ln x<br>(intercept = ln a, slope = b)</td><td>Heads toward the origin. b &gt; 1 curves upward, 0 &lt; b &lt; 1 bends over, b &lt; 0 decays.</td><td>x &gt; 0, y &gt; 0</td></tr>
          <tr><td class="sym">Exponential</td><td class="mono">y = a·eᵇˣ</td><td class="mono">ln y on x<br>(intercept = ln a, slope = b)</td><td>Same percentage change per unit of x: explosive growth, or decay that approaches zero.</td><td>y &gt; 0</td></tr>
          <tr><td class="sym">Reciprocal of x</td><td class="mono">y = b₀ + b₁/x</td><td class="mono">y on 1/x</td><td>Drops steeply at small x, then levels off toward a nonzero limit b₀.</td><td>x ≠ 0</td></tr>
          <tr><td class="sym">Reciprocal of y</td><td class="mono">y = 1 / (b₀ + b₁x)</td><td class="mono">1/y on x</td><td>Decays like flow through resistances in series: 1/y grows linearly with x.</td><td>y ≠ 0</td></tr>
        </tbody>
      </table></div>
    </section>
    <section class="cs" id="cs-shapes">
      <h3>Model shapes by the signs of a and b</h3>
      <p>Each model written with two coefficients, a and b. The four panels show how the curve changes as each coefficient is positive or negative. Axes cross at zero; dashed lines mark asymptotes. For the quadratic, a is the x coefficient and b is the x² coefficient, with the intercept set to 0.</p>
      ${shapeGallery()}
      <p class="small">Models fit through ln y (power and exponential) need y &gt; 0, so they are only fit directly when a &gt; 0. With a &lt; 0 every y is negative, and the model is fit to −y instead.</p>
    </section>
    <section class="cs" id="cs-explore">
      <h3>Exploring the data</h3>
      <div class="cs2">
        <div>
          <h4>Raw scatter first</h4>
          <ul>
            <li>Is the trend straight or curved? Increasing or decreasing?</li>
            <li>Does it level off toward a limit (reciprocal of x), approach zero (exponential, power, reciprocal of y), keep growing slowly (log), or bend once (quadratic)?</li>
            <li>Check the signs: a model that needs ln y cannot be used if any y ≤ 0.</li>
          </ul>
        </div>
        <div>
          <h4>Diagnostic views</h4>
          <div class="tscroll"><table class="cst">
            <thead><tr><th>View</th><th>Straight line means</th></tr></thead>
            <tbody>
              <tr><td class="mono">y vs ln x</td><td>Logarithmic</td></tr>
              <tr><td class="mono">ln y vs ln x</td><td>Power</td></tr>
              <tr><td class="mono">ln y vs x</td><td>Exponential</td></tr>
              <tr><td class="mono">y vs 1/x</td><td>Reciprocal of x</td></tr>
              <tr><td class="mono">1/y vs x</td><td>Reciprocal of y</td></tr>
              <tr><td class="mono">Residuals from a line</td><td>Random scatter supports linear; a U or ∩ shape points to quadratic or a transformation</td></tr>
            </tbody>
          </table></div>
        </div>
      </div>
    </section>
    <section class="cs" id="cs-stats">
      <h3>Comparison statistics</h3>
      <div class="tscroll"><table class="cst">
        <thead><tr><th>Statistic</th><th>Formula</th><th>What it tells you</th><th>Compare across models?</th></tr></thead>
        <tbody>
          <tr><td class="sym">R²</td><td class="mono">1 − SSE/SST</td><td>Share of the variation in the <em>fitted response</em> explained by the model.</td><td>Only between models fit to the same response (y with y). Never compare a ln y or 1/y fit’s R² with a y fit’s R².</td></tr>
          <tr><td class="sym">adj R²</td><td class="mono">1 − (1 − R²)(n − 1)/(n − p)</td><td>R² penalized for the number of parameters p, so an extra x² term has to earn its place.</td><td>Same restriction as R².</td></tr>
          <tr><td class="sym">s</td><td class="mono">√( Σ(y − ŷ)² / (n − p) )</td><td>Typical prediction error in the units of y, after converting every model back to y.</td><td>Yes. Smaller is better.</td></tr>
          <tr><td class="sym">p-value</td><td class="mono">t = b / SE(b)</td><td>Tests whether a term’s coefficient is zero. A term with p &gt; 0.05 is not contributing.</td><td>Checked within each model.</td></tr>
        </tbody>
      </table></div>
      <h4>Residual plots</h4>
      <div class="tails">
        <figure>${residMini('random')}<figcaption><b>Random band</b><br>No pattern. The model form is adequate.</figcaption></figure>
        <figure>${residMini('curve')}<figcaption><b>Curved (U or ∩)</b><br>The model misses curvature. Eliminate it.</figcaption></figure>
        <figure>${residMini('funnel')}<figcaption><b>Funnel</b><br>Spread grows with x. A ln y model often fixes this.</figcaption></figure>
      </div>
    </section>
    <section class="cs" id="cs-rules">
      <h3>Elimination and selection rules</h3>
      <ol class="steps">
        <li><b>Residual pattern:</b> eliminate any model whose residuals show a curve or trend, even with a high R².</li>
        <li><b>Non-significant term:</b> eliminate a model with any term p &gt; 0.05. A quadratic whose x² term is not significant should give way to the simpler model.</li>
        <li><b>Larger s:</b> among the models still standing, eliminate those with a larger s than the best one.</li>
        <li><b>Lower adjusted R²:</b> a valid reason only when both models were fit to the same response scale.</li>
        <li><b>Select</b> the valid model with the smallest s. When two valid models have nearly the same s, the simpler or more physically sensible one is a defensible choice.</li>
      </ol>
    </section>
    </div>
    <div class="sheet-foot"><button class="btn primary" data-act="sheet-close" type="button">Close and start data set ${S.idx + 1}</button></div>
  </div></div>`;
}

// ---------- render ----------
let scrollTarget = null;
function render() {
  const y = window.scrollY;
  const app = document.getElementById('app');
  const sheet = S.phase === 'play' && S.sheetOpen;
  app.innerHTML = header() + `<main class="wrap" ${sheet ? 'inert' : ''}>${S.phase === 'start' ? startView() : S.phase === 'play' ? playView() : reportView()}</main>` + (sheet ? cheatSheet() : '');
  document.documentElement.classList.toggle('locked', !!sheet);
  window.scrollTo(0, y);
  if (sheet) { const c = document.getElementById('sheetClose'); if (c) c.focus({ preventScroll: true }); }
  if (scrollTarget) {
    const el = document.getElementById(scrollTarget); scrollTarget = null;
    if (el) { const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  }
}

// ---------- actions ----------
function startGame(name, section) {
  S = { phase: 'play', name, section, order: pickScenarios(), idx: 0, freeHints: 3, results: [], cur: null, startedAt: Date.now(), finishedAt: null, confirmReset: false, sheetOpen: false };
  S.cur = newCur(S.order[0]); window.scrollTo(0, 0); render();
}
function useHint(k) { const cur = S.cur; if (cur.hints[k] !== null) return; cur.hints[k] = S.freeHints > 0 ? 0 : 1; if (S.freeHints > 0) S.freeHints--; render(); }
function closeSheet() { if (!S.cur) return; S.sheetOpen = false; S.cur.briefed = true; window.scrollTo(0, 0); render(); }

function submit1() {
  const cur = S.cur, d = cur.data, v = cur.a1.views;
  if (!v.length) { cur.err = 'Choose at least one view to generate.'; render(); return; }
  cur.err = '';
  const bv = viewFor(d.best);
  const goodViews = MODEL_KEYS.filter(k => d.tier[k] === 'good').map(viewFor);
  let got = 0, ok = false, note;
  if (v.includes(bv)) { got = 2; ok = true; note = `The ${VIEWS[bv].name} view is the one that matters here: ${bv === 'res_lin' ? (d.best === 'lin' ? 'the residuals from a straight line scatter randomly, supporting the linear model' : 'the residuals from a straight line bend, pointing to the quadratic') : 'it straightens the data, pointing to the ' + MODELS[d.best].name.toLowerCase() + ' model'}.`; }
  else if (v.some(x => goodViews.includes(x))) { got = 1; ok = 'part'; note = `Your views point to a good model, but the ${VIEWS[bv].name} view (shown above) points to the best one: ${MODELS[d.best].name.toLowerCase()}.`; }
  else note = `None of your views support a strong model. The ${VIEWS[bv].name} view (shown above) points to the ${MODELS[d.best].name.toLowerCase()} model.`;
  cur.g1 = { items: [{ k: 'Diagnostic views', ok, got, pts: 2 }], raw: got, note };
  cur.part = 2; render();
}
function fitShort() {
  const cur = S.cur, s = cur.a2.short;
  if (s.length < 2 || s.length > 4) { cur.err = 'Shortlist between two and four models.'; render(); return; }
  cur.err = ''; cur.a2.short = MODEL_KEYS.filter(k => s.includes(k)); cur.fitted = true; render();
}
function submit2() {
  const cur = S.cur, d = cur.data, keys = cur.a2.short, e = cur.a2.elim;
  if (keys.some(k => !e[k])) { cur.err = 'Choose Keep or an elimination reason for every model.'; render(); return; }
  if (!keys.some(k => e[k] === 'keep')) { cur.err = 'Keep at least one model so you have something to recommend.'; render(); return; }
  cur.err = '';
  const inBest = keys.includes(d.best), poor = keys.filter(k => d.tier[k] === 'poor').length;
  const sl = (inBest ? 1 : 0) + (poor <= 1 ? 0.5 : 0);
  const ref = bestOf(d.fits, keys), per = 3.5 / keys.length;
  const elimItems = keys.map(k => {
    const call = e[k];
    const vr = validReasons(d.fits, k, ref);
    const ok = k === ref ? call === 'keep' : (call !== 'keep' && vr.includes(call));
    const should = k === ref ? 'Keep' : 'Eliminate (' + vr.map(r => REASONS.find(x => x.v === r).o.replace('Eliminate: ', '')).join(', ') + ')';
    return { k, ok, should };
  });
  const got = elimItems.filter(i => i.ok).length * per;
  const notes = [];
  notes.push(inBest ? `Your shortlist included the best model, ${MODELS[d.best].name.toLowerCase()}.` : `Your shortlist missed the best model, ${MODELS[d.best].name.toLowerCase()}.`);
  if (poor > 1) notes.push(`${poor} of your shortlisted models were poor fits; aim for a shortlist that the views support.`);
  notes.push(`Within your shortlist, the model to keep was <b>${MODELS[ref].name}</b> (${whyModel(d, ref)}). Eliminations are graded against it.`);
  const cross = keys.filter(k => k !== ref && e[k] === 'lower_adj' && MODELS[k].scale !== MODELS[ref].scale);
  if (cross.length) notes.push(`Adjusted R² cannot eliminate ${cross.map(k => MODELS[k].name).join(', ')}: it was fit on ${MODELS[cross[0]].scale}, while ${MODELS[ref].name} was fit on ${MODELS[ref].scale}. Compare s instead.`);
  cur.g2 = { items: [
    { k: 'Shortlist', ok: sl === 1.5 ? true : sl > 0 ? 'part' : false, got: sl, pts: 1.5, note: `${inBest ? '+1 best model included' : 'best model missing'} · ${poor <= 1 ? '+0.5 at most one poor model' : 'too many poor models'}` },
    { k: 'Keep / eliminate decisions', ok: got >= 3.499 ? true : got > 0 ? 'part' : false, got: Math.round(got * 100) / 100, pts: 3.5, note: `${elimItems.filter(i => i.ok).length} of ${keys.length} correct` },
  ], elimItems, notes, raw: sl + got };
  cur.part = 3; scrollTarget = 'p3'; render();
}
function submit3() {
  const cur = S.cur, d = cur.data, k = cur.a3.final, sc = scById(cur.id);
  if (!k) { cur.err = 'Choose your final model.'; render(); return; }
  cur.err = '';
  const t = d.tier[k], got = t === 'best' ? 3 : t === 'good' ? 1.5 : 0;
  cur.g3 = { items: [{ k: `Final model: ${MODELS[k].name}`, ok: t === 'best' ? true : t === 'good' ? 'part' : false, got, pts: 3, note: t === 'best' ? 'best model' : t === 'good' ? 'good, but not the best' : 'poor fit for these data' }], raw: got };
  const s1 = partScore(cur.g1, cur, 1), s2 = partScore(cur.g2, cur, 2), s3 = partScore(cur.g3, cur, 3);
  S.results.push({ id: sc.id, title: sc.title, best: MODELS[d.best].name, pick: MODELS[k].name, s1, s2, s3, hints: [1, 2, 3].filter(j => cur.hints[j] !== null).length, sheet: cur.sheet, total: s1 + s2 + s3 });
  cur.part = 4; render();
}
function next() {
  if (S.idx < 9) { S.idx++; S.cur = newCur(S.order[S.idx]); window.scrollTo(0, 0); render(); }
  else { S.phase = 'report'; S.finishedAt = Date.now(); S.cur = null; window.scrollTo(0, 0); render(); }
}

function bind() {
  const app = document.getElementById('app');
  app.addEventListener('submit', e => {
    if (e.target.id !== 'startForm') return; e.preventDefault();
    const name = document.getElementById('nameIn').value.trim(), sec = document.getElementById('secIn').value.trim();
    if (!name) { document.getElementById('startErr').hidden = false; document.getElementById('nameIn').focus(); return; }
    startGame(name, sec);
  });
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'hint') useHint(+b.dataset.k);
    else if (act === 'sub1') submit1();
    else if (act === 'fit') fitShort();
    else if (act === 'sub2') submit2();
    else if (act === 'sub3') submit3();
    else if (act === 'next') next();
    else if (act === 'print') window.print();
    else if (act === 'sheet-print') { if (isStandalone()) window.print(); else { try { window.print(); } catch (err) { } const n = document.getElementById('printNote'); if (n) n.hidden = false; } }
    else if (act === 'sheet-open') { S.sheetOpen = true; S.cur.sheet = true; render(); }
    else if (act === 'sheet-close' || act === 'begin') closeSheet();
    else if (act === 'jump') { const t = document.getElementById(b.dataset.to); if (t) t.scrollIntoView({ block: 'start' }); }
    else if (act === 'reset') { S.confirmReset = true; render(); }
    else if (act === 'reset-no') { S.confirmReset = false; render(); }
    else if (act === 'reset-yes') { const n = S.name, s = S.section; S = { phase: 'start', name: n, section: s, order: [], idx: 0, freeHints: 3, results: [], cur: null, confirmReset: false, sheetOpen: false }; window.scrollTo(0, 0); render(); }
  });
  app.addEventListener('change', e => {
    const t = e.target; if (!S.cur) return; const cur = S.cur;
    if (t.name === 'f-view') {
      const set = new Set(cur.a1.views); t.checked ? set.add(t.value) : set.delete(t.value);
      if (set.size > 3) { t.checked = false; set.delete(t.value); cur.err = 'You can generate at most three views.'; const er = t.closest('.part').querySelector('.err'); if (er) { er.textContent = cur.err; er.hidden = false; } }
      cur.a1.views = VIEW_KEYS.filter(v => set.has(v));
    } else if (t.name === 'f-short') {
      const set = new Set(cur.a2.short); t.checked ? set.add(t.value) : set.delete(t.value);
      if (set.size > 4) { t.checked = false; set.delete(t.value); const er = t.closest('.part').querySelector('.err'); if (er) { er.textContent = 'You can shortlist at most four models.'; er.hidden = false; } }
      cur.a2.short = MODEL_KEYS.filter(k => set.has(k));
    } else if (t.dataset.elim) { cur.a2.elim[t.dataset.elim] = t.value; }
    else if (t.name === 'f-final') cur.a3.final = t.value;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheetOpen) closeSheet(); });
}
function boot(data) { try { if (data && data.phase) S = data; } catch (e) { } bind(); render(); }
try { window.claude?.hot?.snapshot?.(() => S); } catch (e) { }
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
