residual","OptionFeedback":""},{"Weight":0,"Text":"The correlation between predictor variables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What is the primary advantage of the Box-Cox transformation over simple log or power transformations?","Hint":null,"Feedback":"The Box-Cox transformation uses maximum likelihood estimation to find the optimal power transformation parameter (lambda) that best normalizes the data. This systematic approach removes the guesswork from choosing between different transformations like square root","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.34393-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"It systematically identifies the optimal power transformation parameter","OptionFeedback":""},{"Weight":0,"Text":"It always results in normally distributed residuals regardless of the original data","OptionFeedback":""},{"Weight":0,"Text":"It eliminates multicollinearity among predictors","OptionFeedback":""},{"Weight":0,"Text":"It reduces the impact of outliers without removing them","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What is a key disadvantage of leave-one-out cross-validation compared to k-fold cross-validation?","Hint":null,"Feedback":"Leave-one-out cross-validation requires fitting the model n times (where n is the number of observations)","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026- cal or wave-like pattern suggests that consecutive errors are correlated","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.343931-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Residuals showing a cyclical or wave-like pattern when plotted against observation order","OptionFeedback":""},{"Weight":0,"Text":"Residuals forming a funnel shape when plotted against fitted values","OptionFeedback":""},{"Weight":0,"Text":"Residuals showing an S-shape on a normal probability plot","OptionFeedback":""},{"Weight":0,"Text":"Residuals clustering around specific leverage points","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What characterizes a high leverage point in linear regression?","Hint":null,"Feedback":"Leverage specifically measures how far an observation\u0027s predictor values are from the center of the predictor space. High leverage points have unusual combinations of predictor values","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439312-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"An observation with extreme values in the predictor variables","OptionFeedback":""},{"Weight":0,"Text":"An observation with a large residual","OptionFeedback":""},{"Weight":0,"Text":"An observation that causes significant changes in the regression coefficients","OptionFeedback":""},{"Weight":0,"Text":"An observation that violates the normality assumption","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"When is a square root transformation of the dependent variable most appropriate?","Hint":null,"Feedback":"A square root transformation is particularly useful for count data that follows a Poisson distribution","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439314-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When the data follows a Poisson distribution or the variance is proportional to the mean","OptionFeedback":""},{"Weight":0,"Text":"When the relationship between variables is exponential","OptionFeedback":""},{"Weight":0,"Text":"When the dependent variable is negatively skewed","OptionFeedback":""},{"Weight":0,"Text":"When dealing with percentage or proportion data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What is the trade-off when increasing the proportion of data used for testing in cross-validation?","Hint":null,"Feedback":"Using a larger test set provides more reliable (lower variance) estimates of model performance","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439317-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The variance of performance estimates decreases","OptionFeedback":""},{"Weight":0,"Text":"The bias of performance estimates increases","OptionFeedback":""},{"Weight":0,"Text":"The model complexity increases","OptionFeedback":""},{"Weigh u0027t capturing. This systematic pattern suggests that a higher-order term or nonlinear transformation might improve the model.","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439321-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A U-shaped or inverted U-shaped pattern when plotting residuals against fitted values","OptionFeedback":""},{"Weight":0,"Text":"A funnel shape when plotting residuals against fitted values","OptionFeedback":""},{"Weight":0,"Text":"A random scatter with no pattern when plotting residuals against fitted values","OptionFeedback":""},{"Weight":0,"Text":"A straight diagonal line on a normal probability plot","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What is the primary purpose of DFBETAS in regression diagnostics?","Hint":null,"Feedback":"DFBETAS measures the standardized change in each regression coefficient when an observation is excluded. Unlike Cook\u0027s Distance","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439324-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To measure how each observation affects each regression coefficient","OptionFeedback":""},{"Weight":0,"Text":"To measure how each observation affects the overall model fit","OptionFeedback":""},{"Weight":0,"Text":"To identify observations with high leverage","OptionFeedback":""},{"Weight":0,"Text":"To detect heteroscedasticity in the residuals","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"When might an inverse transformation (1/y) of the dependent variable be appropriate?","Hint":null,"Feedback":"An inverse transformation is useful when the relationship follows a diminishing returns pattern","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439328-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When the effect of predictors diminishes as the dependent variable increases","OptionFeedback":""},{"Weight":0,"Text":"When the dependent variable shows a symmetric distribution","OptionFeedback":""},{"Weight":0,"Text":"When the variance of residuals is constant across all fitted values","OptionFeedback":""},{"Weight":0,"Text":"When the relationship is already approximately linear","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"When is stratified sampling particularly important in cross-validation for regression models?","Hint":null,"Feedback":"Stratified sampling ensures that each fold contains approximately the same distribution of the dependent variable values as the full dataset. This is especially important when the dependent variable has an uneven distribution or contains rare values","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439331-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When the dependent variable is unevenly distributed or there are rare outcome values","OptionFeedback":""},{"Weight":0,"Text":"When all predictors are categorical variables","OptionFeedback":""},{"Weight":0,"Text":"When the model shows perfect homoscedasticity","OptionFeedback":""},{"Weight":0,"Text":"When sample size is extremely large","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What happens to prediction intervals when extrapolating beyond the range of the observed data?","Hint":null,"Feedback":"Prediction intervals become wider when extrapolating beyond the range of observed data. This increasing width reflects the growing uncertainty in predictions as we move farther from the region where we have empirical evidence about the relationship between variables.","TopicTitle":"Module 13 Quiz - Validating Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.3439333-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"They become wider","OptionFeedback":""},{"Weight":0,"Text":"They remain the same width as at the edges of the observed data","OptionFeedback":""},{"Weight":0,"Text":"They become narrower due to the linear nature of the model","OptionFeedback":""},{"Weight":0,"Text":"Their width is unpredictable and depends only on the specific data pattern","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"Which of the following is the most appropriate for identifying outliers in the response variable?","Hint":null,"Feedback":"Studentized residuals (especially externally studentized or \u0027deleted\u0027 residuals) are
