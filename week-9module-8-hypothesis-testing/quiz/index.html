  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Week_9_Module_8_-_Hypothesis_Testing","CourseName":"EGN3443 Prob and Stats for Engineers","LastModified":"2026-08-24T17:26:30.7202723-04:00","NextQuestionNumber":46,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"An engineer is testing whether a new manufacturing process reduces the mean diameter of ball bearings from the current standard of 10.00 mm. A sample of 25 bearings produced with the new process has a mean diameter of 9.92 mm with a standard deviation of 0.15 mm. What are the appropriate null and alternative hypotheses?","Hint":null,"Feedback":"Since we are testing whether the new process reduces the diameter, we are looking for evidence that the mean is less than 10.00 mm. Therefore, the alternative hypothesis should be one-sided: H\u2081: \u03BC \u003C 10.00 mm. The null hypothesis is the status quo: H\u2080: \u03BC = 10.00 mm.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202548-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"H\u2080: \u03BC = 10.00 mm","OptionFeedback":""},{"Weight":100,"Text":"H\u2080: \u03BC = 10.00 mm","OptionFeedback":""},{"Weight":0,"Text":"H\u2080: \u03BC \u2265 10.00 mm","OptionFeedback":""},{"Weight":0,"Text":"H\u2080: \u03BC \u2264 10.00 mm","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"A civil engineer is testing whether a new concrete mixture has a breaking strength different from the current standard of 3500 psi. The engineer wants to determine if there is any change (increase or decrease) in strength. What type of test should be used?","Hint":null,"Feedback":"Since the engineer wants to detect any change in strength (either increase or decrease), a two-tailed test is appropriate with H\u2080: \u03BC = 3500 psi and H\u2081: \u03BC \u2260 3500 psi.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202556-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"One-tailed test with H\u2081: \u03BC \u003E 3500 psi","OptionFeedback":""},{"Weight":0,"Text":"One-tailed test with H\u2081: \u03BC \u003C 3500 psi","OptionFeedback":""},{"Weight":100,"Text":"Two-tailed test with H\u2081: \u03BC \u2260 3500 psi","OptionFeedback":""},{"Weight":0,"Text":"No hypothesis test is needed","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"An electrical engineer measured the resistance of 16 identical resistors and found a mean of 102.3 ohms with a standard deviation of 2.1 ohms. The manufacturer claims the resistors have a mean resistance of 100 ohms. The engineer performs a hypothesis test with H\u2080: \u03BC = 100 ohms and H\u2081: \u03BC \u2260 100 ohms. Calculate the test statistic (z-value).","Hint":null,"Feedback":"The test statistic is calculated as: z = (x\u0304 - \u03BC\u2080)/(\u03C3/\u221An) = (102.3 - 100)/(2.1/\u221A16) = 2.3/0.525 = 4.38","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.720256-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"z = 2.38","OptionFeedback":""},{"Weight":0,"Text":"z = 1.10","OptionFeedback":""},{"Weight":100,"Text":"z = 4.38","OptionFeedback":""},{"Weight":0,"Text":"z = 3.36","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"In testing a new solar panel design, an engineer collects data on energy output and calculates a p-value of 0.03 when testing against the industry standard output. Using a significance level of \u03B1 = 0.05, what conclusion should be drawn?","Hint":null,"Feedback":"Since the p-value (0.03) is less than the significance level (\u03B1 = 0.05), we reject the null hypothesis. This indicates that there is sufficient evidence to conclude that the new solar panel design differs from the industry standard.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202563-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Fail to reject the null hypothesis","OptionFeedback":""},{"Weight":100,"Text":"Reject the null hypothesis","OptionFeedback":""},{"Weight":0,"Text":"The test is inconclusive","OptionFeedback":""},{"Weight":0,"Text":"The p-value is too high to make a decision","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"A quality engineer is testing whether a new chemical process reduces variability in product purity. After running the test, the p-value is calculated to be 0.078. Using a significance level of \u03B1 = 0.05, which type of error might the engineer be making if they conclude that the new process does not reduce variability?","Hint":null,"Feedback":"Since p-value (0.078) \u003E \u03B1 (0.05), the engineer would fail to reject the null hypothesis and conclude that the new process does not reduce variability. If the new process actually does reduce variability (but the test failed to detect it), this would be a Type II error (false negative).","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202565-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Type I error","OptionFeedback":""},{"Weight":100,"Text":"Type II error","OptionFeedback":""},{"Weight":0,"Text":"Neither Type I nor Type II error","OptionFeedback":""},{"Weight":0,"Text":"Both Type I and Type II error","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"An aerospace engineer is testing a new alloy for tensile strength. Historical data shows that the standard alloy has a mean tensile strength of 950 MPa. The engineer wants to be very confident before adopting the new material and sets \u03B1 = 0.01. The test yields a p-value of 0.015. What is the correct conclusion?","Hint":null,"Feedback":"Since the p-value (0.015) is greater than the chosen significance level (\u03B1 = 0.01), we fail to reject the null hypothesis. There is insufficient evidence at the 0.01 significance level to conclude that the new alloy differs from the standard.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202571-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Reject the null hypothesis because the p-value is small","OptionFeedback":""},{"Weight":100,"Text":"Fail to reject the null hypothesis because p-value \u003E \u03B1","OptionFeedback":""},{"Weight":0,"Text":"Reject the null hypothesis because the difference is practically significant","OptionFeedback":""},{"Weight":0,"Text":"The test is inconclusive and more data should be collected","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"A mechanical engineer tests the durability of a new bearing design. The sample mean lifetime is 5200 hours compared to the standard 5000 hours, with a p-value of 0.048. The gain of 200 hours represents only a 4% improvement, which is less than the 10% improvement needed to justify the higher production cost. This situation best represents:","Hint":null,"Feedback":"The result is statistically significant (p-value = 0.048 \u003C \u03B1 = 0.05) but not practically significant (4% improvement \u003C required 10% improvement). This illustrates that statistical significance doesn\u0027t always imply practical importance.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202574-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Statistical significance without practical significance","OptionFeedback":""},{"Weight":0,"Text":"Practical significance without statistical significance","OptionFeedback":""},{"Weight":0,"Text":"Both statistical and practical significance","OptionFeedback":""},{"Weight":0,"Text":"Neither statistical nor practical significance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"In testing the efficiency of a new heat exchanger design, an engineer obtains a p-value of 0.073 with \u03B1 = 0.05. The sample size was relatively small (n = 12). Which of the following statements is most accurate?","Hint":null,"Feedback":"With a p-value (0.073) slightly above \u03B1 (0.05) and a small sample size (n = 12), the test likely lacks statistical power. The small sample size makes it difficult to detect small but potentially meaningful differences, increasing the risk of a Type II error.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202577-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The null hypothesis should be rejected","OptionFeedback":""},{"Weight":0,"Text":"The new design is definitely not more efficient","OptionFeedback":""},{"Weight":100,"Text":"The test lacks power due to small sample size","OptionFeedback":""},{"Weight":0,"Text":"The significance level should be increased to 0.1","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"An environmental engineer is testing whether a new filtration system reduces contaminant levels below the regulatory limit of 5 ppm. What are the appropriate null and alternative hypotheses?","Hint":null,"Feedback":"The engineer wants to demonstrate that the contaminant level is below the regulatory limit. The null hypothesis should be that the contaminant level is at or above the limit (H\u2080: \u03BC \u2265 5 ppm), and the alternative is that it\u0027s below the limit (H\u2081: \u03BC \u003C 5 ppm).","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202579-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"H\u2080: \u03BC = 5 ppm","OptionFeedback":""},{"Weight":0,"Text":"H\u2080: \u03BC \u2264 5 ppm","OptionFeedback":""},{"Weight":0,"Text":"H\u2080: \u03BC = 5 ppm","OptionFeedback":""},{"Weight":100,"Text":"H\u2080: \u03BC \u2265 5 ppm","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"A production engineer implements a process improvement and tests whether the defect rate has decreased from the historical rate of 3%. After collecting data on 500 units and finding 10 defects (2%), the engineer calculates a p-value of 0.159. If the engineer incorrectly concludes that the process improvement was successful in reducing defects, this would be an example of:","Hint":null,"Feedback":"With p-value (0.159) \u003E typical \u03B1 (0.05), we should fail to reject the null hypothesis. If the engineer incorrectly concludes that the defect rate has decreased (rejects H\u2080 when it\u0027s actually true), this would be a Type I error (false positive).","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202583-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Type I error","OptionFeedback":""},{"Weight":0,"Text":"Type II error","OptionFeedback":""},{"Weight":0,"Text":"Correctly rejecting the null hypothesis","OptionFeedback":""},{"Weight":0,"Text":"Correctly failing to reject the null hypothesis","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What is the null hypothesis (H\u2080) in statistical testing?","Hint":null,"Feedback":"The null hypothesis (H\u2080) is a statement of no effect","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202586-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A statement of no effect","OptionFeedback":""},{"Weight":0,"Text":"A statement claiming that an effect or relationship exists between variables","OptionFeedback":""},{"Weight":0,"Text":"A statistical test used to determine the validity of the research question","OptionFeedback":""},{"Weight":0,"Text":"The hypothesis that the researcher hopes to prove true","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What is the alternative hypothesis (H\u2081 or H\u2090) in statistical testing?","Hint":null,"Feedback":"The alternative hypothesis (H\u2081 or H\u2090) is a statement that contradicts the null hypothesis","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202589-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A statement claiming that an effect","OptionFeedback":""},{"Weight":0,"Text":"A statement of no effect","OptionFeedback":"or no relationship between variables"},{"Weight":0,"Text":"A backup hypothesis used when the null hypothesis fails","OptionFeedback":""},{"Weight":0,"Text":"The hypothesis that is always rejected in valid research","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What is a Type I error in hypothesis testing?","Hint":null,"Feedback":"A Type I error occurs when we reject a null hypothesis that is actually true","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202592-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Rejecting a true null hypothesis (false positive)","OptionFeedback":""},{"Weight":0,"Text":"Failing to reject a false null hypothesis (false negative)","OptionFeedback":""},{"Weight":0,"Text":"Correctly rejecting a false null hypothesis (true positive)","OptionFeedback":""},{"Weight":0,"Text":"Correctly failing to reject a true null hypothesis (true negative)","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What is a Type II error in hypothesis testing?","Hint":null,"Feedback":"A Type II error occurs when we fail to reject a null hypothesis that is actually false","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202595-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Failing to reject a false null hypothesis (false negative)","OptionFeedback":""},{"Weight":0,"Text":"Rejecting a true null hypothesis (false positive)","OptionFeedback":""},{"Weight":0,"Text":"Correctly rejecting a false null hypothesis (true positive)","OptionFeedback":""},{"Weight":0,"Text":"Correctly failing to reject a true null hypothesis (true negative)","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"What does the p-value represent in hypothesis testing?","Hint":null,"Feedback":"The p-value represents the probability of obtaining the observed results","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202597-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The probability of obtaining the observed results","OptionFeedback":""},{"Weight":0,"Text":"The probability that the null hypothesis is true","OptionFeedback":""},{"Weight":0,"Text":"The probability that the alternative hypothesis is true","OptionFeedback":""},{"Weight":0,"Text":"The percentage of variation in the dependent variable explained by the independent variable","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"What is the significance level (\u03B1) in hypothesis testing?","Hint":null,"Feedback":"The significance level (\u03B1) is the predetermined threshold (commonly 0.05 or 5%) below which the p-value must fall for the null hypothesis to be rejected. It represents the acceptable risk of making a Type I error.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.72026-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The predetermined threshold for rejecting the null hypothesis","OptionFeedback":""},{"Weight":0,"Text":"The probability that the null hypothesis is true","OptionFeedback":""},{"Weight":0,"Text":"The minimum sample size required for statistical analysis","OptionFeedback":""},{"Weight":0,"Text":"The confidence level for the statistical test","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"How is the significance level (\u03B1) related to Type I error?","Hint":null,"Feedback":"The significance level (\u03B1) directly equals the probability of committing a Type I error. When you set \u03B1 = 0.05","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202603-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The significance level equals the probability of committing a Type I error","OptionFeedback":""},{"Weight":0,"Text":"The significance level equals the probability of committing a Type II error","OptionFeedback":""},{"Weight":0,"Text":"The significance level is inversely related to the probability of committing a Type I error","OptionFeedback":""},{"Weight":0,"Text":"The significance level has no relationship with Type I error","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What is statistical power in hypothesis testing?","Hint":null,"Feedback":"Statistical power is the probability of correctly rejecting a false null hypothesis","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.720262-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The probability of correctly rejecting a false null hypothesis (1 - \u03B2)","OptionFeedback":""},{"Weight":0,"Text":"The probability of incorrectly rejecting a true null hypothesis (\u03B1)","OptionFeedback":""},{"Weight":0,"Text":"The probability of correctly failing to reject a true null hypothesis (1 - \u03B1)","OptionFeedback":""},{"Weight":0,"Text":"The probability of incorrectly failing to reject a false null hypothesis (\u03B2)","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"Which of the following factors increases statistical power?","Hint":null,"Feedback":"A larger sample size increases statistical power because it provides more data","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202623-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Larger sample size","OptionFeedback":""},{"Weight":0,"Text":"Smaller effect size","OptionFeedback":""},{"Weight":0,"Text":"Higher significance level (e.g.","OptionFeedback":""},{"Weight":0,"Text":"Higher variability in the data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"When is a one-tailed hypothesis test more appropriate than a two-tailed test?","Hint":null,"Feedback":"A one-tailed test is appropriate when the researcher is only interested in an effect in one specific direction (e.g.","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202626-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When the researcher is only interested in an effect in one specific direction","OptionFeedback":""},{"Weight":0,"Text":"When the sample size is small","OptionFeedback":""},{"Weight":0,"Text":"When the data are not normally distributed","OptionFeedback":""},{"Weight":0,"Text":"When testing multiple hypotheses simultaneously","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"If a statistical test yields a p-value of 0.03","Hint":null,"Feedback":"A p-value of 0.03 means that if the null hypothesis is true","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202629-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"If the null hypothesis is true","OptionFeedback":""},{"Weight":0,"Text":"There is a 3% probability that the null hypothesis is true","OptionFeedback":""},{"Weight":0,"Text":"There is a 97% probability that the alternative hypothesis is true","OptionFeedback":""},{"Weight":0,"Text":"The effect size of the relationship between variables is 3%","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"What is the difference between statistical significance and practical significance?","Hint":null,"Feedback":"Statistical significance only tells us that results are unlikely to be due to chance (p \u003C \u03B1)","TopicTitle":"Module 8 Quiz - Hypothesis Testing","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.7202631-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,
