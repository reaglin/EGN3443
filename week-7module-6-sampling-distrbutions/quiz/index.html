  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Week_7_Module_6_-_Sampling_Distrbutions","CourseName":"EGN3443 Prob and Stats for Engineers","LastModified":"2026-08-24T17:26:30.4945903-04:00","NextQuestionNumber":46,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"A manufacturing process produces parts with a non-normal distribution of lengths. If you take samples of size 30, what can you conclude about the distribution of sample means?","Hint":null,"Feedback":"According to the Central Limit Theorem, regardless of the underlying population distribution, the sampling distribution of the sample mean approaches a normal distribution as the sample size increases. A sample size of 30 is generally considered large enough for the CLT to apply in most practical situations.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945726-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It will follow the same non-normal distribution as the population","OptionFeedback":""},{"Weight":100,"Text":"It will approach a normal distribution","OptionFeedback":""},{"Weight":0,"Text":"It will follow a t-distribution","OptionFeedback":""},{"Weight":0,"Text":"It cannot be determined without knowing the specific non-normal distribution","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"The diameters of bolts from a manufacturing process follow a normal distribution with mean 10 mm and standard deviation 0.2 mm. If samples of size 16 are taken, what is the standard deviation of the sampling distribution of the sample mean?","Hint":null,"Feedback":"The standard deviation of the sampling distribution (standard error) is calculated as \u03C3/\u221An, where \u03C3 is the population standard deviation and n is the sample size. Therefore, 0.2/\u221A16 = 0.2/4 = 0.05 mm.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945748-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"0.2 mm","OptionFeedback":""},{"Weight":100,"Text":"0.05 mm","OptionFeedback":""},{"Weight":0,"Text":"0.8 mm","OptionFeedback":""},{"Weight":0,"Text":"3.2 mm","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"In hypothesis testing, what happens to the standard error as the sample size increases?","Hint":null,"Feedback":"The standard error is calculated as \u03C3/\u221An, where \u03C3 is the population standard deviation and n is the sample size. As n increases, the standard error decreases proportionally to the square root of n, making our estimate of the population mean more precise.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945755-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It increases proportionally to the sample size","OptionFeedback":""},{"Weight":100,"Text":"It decreases proportionally to the square root of the sample size","OptionFeedback":""},{"Weight":0,"Text":"It remains constant regardless of sample size","OptionFeedback":""},{"Weight":0,"Text":"It increases proportionally to the square root of the sample size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"A civil engineer measures the compressive strength of 36 concrete cylinders and finds a mean of 3500 psi with a standard deviation of 300 psi. What is the 95% confidence interval for the true mean compressive strength?","Hint":null,"Feedback":"For a 95% confidence interval, we use the formula x\u0304 \u00B1 z(s/\u221An), where x\u0304 is the sample mean, z is the critical value (1.96 for 95%), s is the sample standard deviation, and n is the sample size. Therefore: 3500 \u00B1 1.96(300/\u221A36) = 3500 \u00B1 1.96(300/6) = 3500 \u00B1 1.96(50) = 3500 \u00B1 98 psi.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945758-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"3500 \u00B1 98 psi","OptionFeedback":""},{"Weight":0,"Text":"3500 \u00B1 196 psi","OptionFeedback":""},{"Weight":0,"Text":"3500 \u00B1 600 psi","OptionFeedback":""},{"Weight":0,"Text":"3500 \u00B1 49 psi","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"An electrical engineer wants to estimate the mean current draw of a new circuit with a margin of error of 0.15 amps at a 95% confidence level. Based on preliminary tests, the standard deviation is approximately 0.8 amps. What is the minimum sample size needed?","Hint":null,"Feedback":"The formula for calculating the required sample size is n = (z\u00B2\u03C3\u00B2)/E\u00B2, where z is the critical value (1.96 for 95% confidence), \u03C3 is the standard deviation, and E is the margin of error. Therefore: n = (1.96\u00B2)(0.8\u00B2)/(0.15\u00B2) = (3.8416)(0.64)/(0.0225) = 2.459/0.0225 = 109.3, rounded up to 109.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945761-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"30","OptionFeedback":""},{"Weight":0,"Text":"69","OptionFeedback":""},{"Weight":100,"Text":"109","OptionFeedback":""},{"Weight":0,"Text":"178","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"The time to failure of a specific electronic component follows an exponential distribution with a mean of 1000 hours. If you randomly select 50 components and calculate their mean time to failure, what would be the shape of the sampling distribution?","Hint":null,"Feedback":"According to the Central Limit Theorem, regardless of the shape of the population distribution (in this case exponential), the sampling distribution of the sample mean will approach a normal distribution as the sample size increases. With n = 50, the sampling distribution will be approximately normal.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945765-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Exponential distribution","OptionFeedback":""},{"Weight":100,"Text":"Normal distribution","OptionFeedback":""},{"Weight":0,"Text":"Chi-square distribution","OptionFeedback":""},{"Weight":0,"Text":"Uniform distribution","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What is the correct interpretation of a 90% confidence interval for the mean tensile strength of an aluminum alloy calculated as 350 \u00B1 10 MPa?","Hint":null,"Feedback":"The correct interpretation of a confidence interval relates to the procedure used to create it. If we repeatedly sampled from the population and constructed 90% confidence intervals, approximately 90% of those intervals would contain the true population mean. A single confidence interval either contains the true mean or it doesn\u0027t; we just don\u0027t know which.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945768-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"90% of all samples will have a mean tensile strength between 340 and 360 MPa","OptionFeedback":""},{"Weight":0,"Text":"The probability that the population mean is between 340 and 360 MPa is 0.9","OptionFeedback":""},{"Weight":100,"Text":"If we took many samples and constructed confidence intervals","OptionFeedback":""},{"Weight":0,"Text":"90% of the individual tensile strength measurements fall between 340 and 360 MPa","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"A chemical engineer measures the concentration of a solution 25 times and finds a sample standard deviation of 0.5 mg/L. What is the standard error of the mean?","Hint":null,"Feedback":"The standard error of the mean is calculated as s/\u221An, where s is the sample standard deviation and n is the sample size. Therefore, 0.5/\u221A25 = 0.5/5 = 0.1 mg/L.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945771-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"0.5 mg/L","OptionFeedback":""},{"Weight":100,"Text":"0.1 mg/L","OptionFeedback":""},{"Weight":0,"Text":"0.125 mg/L","OptionFeedback":""},{"Weight":0,"Text":"2.5 mg/L","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What happens to the width of a confidence interval as the sample size increases, assuming all other factors remain constant?","Hint":null,"Feedback":"The width of a confidence interval is proportional to the standard error, which is inversely proportional to the square root of the sample size (s/\u221An). As the sample size increases, the standard error decreases, making the confidence interval narrower. Specifically, to cut the width of a confidence interval in half, you need to quadruple the sample size.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945773-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It increases linearly","OptionFeedback":""},{"Weight":0,"Text":"It remains the same","OptionFeedback":""},{"Weight":100,"Text":"It decreases proportionally to the square root of the sample size","OptionFeedback":""},{"Weight":0,"Text":"It decreases proportionally to the sample size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"An aerospace engineer is estimating the mean tensile strength of a new composite material. With a sample size of 40, the sample mean is 1200 MPa and the sample standard deviation is 95 MPa. What is the margin of error for a 95% confidence interval?","Hint":null,"Feedback":"The margin of error E = z(s/\u221An), where z is the critical value (1.96 for 95% confidence), s is the sample standard deviation, and n is the sample size. Therefore: E = 1.96(95/\u221A40) = 1.96(95/6.32) = 1.96(15) = 29.4 MPa.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945778-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"29.4 MPa","OptionFeedback":""},{"Weight":0,"Text":"14.7 MPa","OptionFeedback":""},{"Weight":0,"Text":"190 MPa","OptionFeedback":""},{"Weight":0,"Text":"2.6 MPa","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"Which of the following best describes the Central Limit Theorem?","Hint":null,"Feedback":"The Central Limit Theorem states that the sampling distribution of the sample mean approaches a normal distribution as the sample size increases, regardless of the shape of the population distribution.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.494578-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The sampling distribution of the sample mean approaches a normal distribution as the sample size increases, regardless of the shape of the population distribution.","OptionFeedback":""},{"Weight":0,"Text":"The sample mean will always equal the population mean regardless of sample size.","OptionFeedback":""},{"Weight":0,"Text":"The standard deviation of a sample is always smaller than the population standard deviation.","OptionFeedback":""},{"Weight":0,"Text":"The sampling distribution is always normally distributed regardless of sample size.","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"If a population has a standard deviation of 15, what is the standard error of the mean for a sample of size 25?","Hint":null,"Feedback":"The standard error of the mean is \u03C3/\u221An = 15/\u221A25 = 15/5 = 3.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945783-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"15","OptionFeedback":""},{"Weight":0,"Text":"0.6","OptionFeedback":""},{"Weight":100,"Text":"3","OptionFeedback":""},{"Weight":0,"Text":"2.5","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"How does increasing the sample size affect the standard error of the mean?","Hint":null,"Feedback":"As the sample size (n) increases, the denominator in the standard error formula (\u03C3/\u221An) increases, which decreases the standard error.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945786-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It increases the standard error.","OptionFeedback":""},{"Weight":100,"Text":"It decreases the standard error.","OptionFeedback":""},{"Weight":0,"Text":"It has no effect on the standard error.","OptionFeedback":""},{"Weight":0,"Text":"It can either increase or decrease the standard error, depending on the population.","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"A 95% confidence interval for a population mean has a width of 10 units. What would be the approximate width of a 99% confidence interval using the same sample?","Hint":null,"Feedback":"The width of a 95% CI is 10 units = 2 \u00D7 1.96 \u00D7 SE. For 99% CI, width \u2248 2 \u00D7 2.576 \u00D7 SE \u2248 (2.576/1.96) \u00D7 10 \u2248 1.315 \u00D7 10 \u2248 13 units.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945788-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"5 units","OptionFeedback":""},{"Weight":0,"Text":"10 units","OptionFeedback":""},{"Weight":0,"Text":"12 units","OptionFeedback":""},{"Weight":100,"Text":"13 units","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"To decrease the margin of error in a confidence interval by half, what should be done to the sample size?","Hint":null,"Feedback":"Since margin of error \u221D 1/\u221An, to reduce it by half, we need \u221An to double. This means n must be quadrupled.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945791-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Double it","OptionFeedback":""},{"Weight":100,"Text":"Quadruple it","OptionFeedback":""},{"Weight":0,"Text":"Halve it","OptionFeedback":""},{"Weight":0,"Text":"Square root it","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"When sampling from a highly skewed population distribution, approximately what minimum sample size is typically needed for the Central Limit Theorem to ensure the sampling distribution of means is approximately normal?","Hint":null,"Feedback":"A commonly cited rule of thumb is that for highly skewed distributions, a sample size of at least 30 is generally required for the sampling distribution to be approximately normal.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945793-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"At least 5","OptionFeedback":""},{"Weight":0,"Text":"At least 10","OptionFeedback":""},{"Weight":100,"Text":"At least 30","OptionFeedback":""},{"Weight":0,"Text":"At least 100","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What does the standard error of the mean represent?","Hint":null,"Feedback":"The standard error of the mean represents the standard deviation of the sampling distribution of the sample mean, indicating how much sample means vary from sample to sample.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945796-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The standard deviation of the population","OptionFeedback":""},{"Weight":0,"Text":"The standard deviation of the sample","OptionFeedback":""},{"Weight":0,"Text":"The expected difference between the sample mean and the true population mean","OptionFeedback":""},{"Weight":100,"Text":"The standard deviation of the sampling distribution of the sample mean","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"A population has a mean of 50 and a standard deviation of 10. If samples of size 64 are taken, what is the approximate probability that a sample mean will be greater than 52?","Hint":null,"Feedback":"Using CLT, the sampling distribution has mean 50 and standard error 10/\u221A64 = 1.25. Standardizing: Z = (52-50)/1.25 = 1.6. P(Z \u003E 1.6) = 0.0668.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.49458-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"0.5","OptionFeedback":""},{"Weight":0,"Text":"0.1587","OptionFeedback":""},{"Weight":100,"Text":"0.0668","OptionFeedback":""},{"Weight":0,"Text":"0.9332","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"Which of the following is the correct interpretation of a 95% confidence interval?","Hint":null,"Feedback":"A 95% confidence interval means that if we were to take many samples and compute a 95% confidence interval from each sample, about 95% of those intervals would contain the population mean.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945803-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"There is a 95% probability that the population mean falls within the interval.","OptionFeedback":""},{"Weight":100,"Text":"If we were to take many samples and compute a 95% confidence interval from each sample, about 95% of those intervals would contain the population mean.","OptionFeedback":""},{"Weight":0,"Text":"95% of the sample data falls within the interval.","OptionFeedback":""},{"Weight":0,"Text":"The sample mean has a 95% chance of being the true population mean.","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"A researcher wants to estimate a population mean with a margin of error of no more than 2 units with 95% confidence. The population standard deviation is 8. What minimum sample size is needed?","Hint":null,"Feedback":"n = (1.96*8/2)\u00B2 = (7.84)\u00B2 = 61.47, rounded up to 62.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945806-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"16","OptionFeedback":""},{"Weight":0,"Text":"32","OptionFeedback":""},{"Weight":100,"Text":"62","OptionFeedback":""},{"Weight":0,"Text":"124","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"How is the standard error of the mean related to the population standard deviation?","Hint":null,"Feedback":"The standard error of the mean is calculated as \u03C3/\u221An, where \u03C3 is the population standard deviation and n is the sample size.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945808-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They are the same thing","OptionFeedback":""},{"Weight":0,"Text":"Standard error is always larger than the standard deviation","OptionFeedback":""},{"Weight":100,"Text":"Standard error equals the standard deviation divided by the square root of the sample size","OptionFeedback":""},{"Weight":0,"Text":"Standard error equals the standard deviation multiplied by the sample size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"According to the Central Limit Theorem, which of the following is NOT necessary for the sampling distribution of the mean to be approximately normal?","Hint":null,"Feedback":"According to the CLT, the sampling distribution of the mean will be approximately normal regardless of the shape of the population distribution, as long as the sample size is sufficiently large.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945811-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The samples must be independent","OptionFeedback":""},{"Weight":0,"Text":"The sample size must be sufficiently large","OptionFeedback":""},{"Weight":100,"Text":"The population distribution must be normal","OptionFeedback":""},{"Weight":0,"Text":"The population must have a finite variance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"A confidence interval for a population mean is given as 45 \u00B1 3. What is the margin of error?","Hint":null,"Feedback":"The margin of error is 3, as it represents how far the confidence interval extends in either direction from the point estimate (45).","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945813-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"3","OptionFeedback":""},{"Weight":0,"Text":"6","OptionFeedback":""},{"Weight":0,"Text":"42","OptionFeedback":""},{"Weight":0,"Text":"48","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What happens to the width of a confidence interval if the confidence level is increased from 95% to 99%, while keeping everything else the same?","Hint":null,"Feedback":"As the confidence level increases, the z-critical value increases, which makes the margin of error larger and therefore the confidence interval wider.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945815-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The width decreases","OptionFeedback":""},{"Weight":100,"Text":"The width increases","OptionFeedback":""},{"Weight":0,"Text":"The width stays the same","OptionFeedback":""},{"Weight":0,"Text":"The width could either increase or decrease, depending on the sample size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"For which of the following population distributions would the Central Limit Theorem be MOST important when working with sample means?","Hint":null,"Feedback":"The Central Limit Theorem is most important for highly skewed distributions like the exponential distribution, as it allows us to use normal-based methods even when the underlying population is far from normal.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945818-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Normal distribution","OptionFeedback":""},{"Weight":0,"Text":"Uniform distribution","OptionFeedback":""},{"Weight":100,"Text":"Exponential distribution","OptionFeedback":""},{"Weight":0,"Text":"Slightly skewed normal distribution","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"As the sample size increases, what happens to the sampling distribution of the sample mean?","Hint":null,"Feedback":"As the sample size increases, the sampling distribution becomes more normal (regardless of the original population distribution) and its variance decreases (since standard error = \u03C3/\u221An).","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.494582-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It becomes more skewed","OptionFeedback":""},{"Weight":0,"Text":"Its variance increases","OptionFeedback":""},{"Weight":0,"Text":"Its mean shifts away from the population mean","OptionFeedback":""},{"Weight":100,"Text":"It becomes more normal and its variance decreases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"A population has a mean of 75 and a standard deviation of 12. If a sample of size 36 has a mean of 72, what is the z-score of this sample mean?","Hint":null,"Feedback":"The z-score is (72 - 75)/(12/\u221A36) = -3/(12/6) = -3/2 = -1.50.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945822-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"-0.25","OptionFeedback":""},{"Weight":100,"Text":"-1.50","OptionFeedback":""},{"Weight":0,"Text":"-2.50","OptionFeedback":""},{"Weight":0,"Text":"-3.00","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"Which of the following is NOT a component used in calculating a confidence interval for a population mean?","Hint":null,"Feedback":"The confidence interval formula uses the sample mean, critical value, and standard error (which is calculated using the sample standard deviation), but not the population variance directly.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945825-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Sample mean","OptionFeedback":""},{"Weight":0,"Text":"Critical value","OptionFeedback":""},{"Weight":0,"Text":"Standard error","OptionFeedback":""},{"Weight":100,"Text":"Population variance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What is the mean of the sampling distribution of the sample mean?","Hint":null,"Feedback":"The mean of the sampling distribution of the sample mean is equal to the population mean, making the sample mean an unbiased estimator of the population mean.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945827-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Equal to the population mean","OptionFeedback":""},{"Weight":0,"Text":"Equal to the sample mean","OptionFeedback":""},{"Weight":0,"Text":"Equal to the population mean minus the standard error","OptionFeedback":""},{"Weight":0,"Text":"Equal to the population mean divided by the sample size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"A 95% confidence interval for a population mean is (42, 50). What is the point estimate of the population mean?","Hint":null,"Feedback":"The point estimate is the sample mean, which is at the center of the confidence interval: (42 \u002B 50)/2 = 46.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945829-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"42","OptionFeedback":""},{"Weight":0,"Text":"50","OptionFeedback":""},{"Weight":100,"Text":"46","OptionFeedback":""},{"Weight":0,"Text":"4","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"To reduce the margin of error by a factor of 3, by what factor should the sample size be increased?","Hint":null,"Feedback":"Since margin of error \u221D 1/\u221An, to reduce it by a factor of 3, we need \u221An to be 3 times larger. This means n must be 3\u00B2 = 9 times larger.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945832-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"3","OptionFeedback":""},{"Weight":100,"Text":"9","OptionFeedback":""},{"Weight":0,"Text":"27","OptionFeedback":""},{"Weight":0,"Text":"1/3","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"Which of the following is an assumption of the Central Limit Theorem?","Hint":null,"Feedback":"The Central Limit Theorem assumes that the samples are random and independent. It does not require the population to be normally distributed or have a specific sample size.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945834-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The population must be normally distributed","OptionFeedback":""},{"Weight":0,"Text":"The sample size must be at least 100","OptionFeedback":""},{"Weight":100,"Text":"The samples must be independent","OptionFeedback":""},{"Weight":0,"Text":"The population mean must be known","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"If the population standard deviation is unknown, what is used in its place when calculating the standard error of the mean?","Hint":null,"Feedback":"When the population standard deviation is unknown, we use the sample standard deviation as an estimate when calculating the standard error of the mean.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945837-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The sample standard deviation","OptionFeedback":""},{"Weight":0,"Text":"The range of the sample","OptionFeedback":""},{"Weight":0,"Text":"The interquartile range of the sample","OptionFeedback":""},{"Weight":0,"Text":"The median absolute deviation of the sample","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"How do outliers in a sample typically affect the width of a confidence interval for the mean?","Hint":null,"Feedback":"Outliers typically increase the sample standard deviation, which increases the standard error and therefore the width of the confidence interval.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945841-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They have no effect on the width","OptionFeedback":""},{"Weight":100,"Text":"They tend to increase the width","OptionFeedback":""},{"Weight":0,"Text":"They tend to decrease the width","OptionFeedback":""},{"Weight":0,"Text":"They always make the confidence interval invalid","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"A population has a mean of 100 and a standard deviation of 20. If samples of size 25 are taken, what is the approximate probability that a sample mean will be between 95 and 105?","Hint":null,"Feedback":"Using CLT, the sampling distribution has mean 100 and standard error 20/\u221A25 = 4. The standardized interval is (95-100)/4 to (105-100)/4 = -1.25 to 1.25. P(-1.25 \u003C Z \u003C 1.25) \u2248 0.6826.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945844-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"0.6826","OptionFeedback":""},{"Weight":0,"Text":"0.5","OptionFeedback":""},{"Weight":100,"Text":"0.6826","OptionFeedback":""},{"Weight":0,"Text":"0.9544","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q036","Type":"MC","Title":"Question 36","QuestionText":"What is the variance of the sampling distribution of the sample mean?","Hint":null,"Feedback":"The variance of the sampling distribution of the sample mean is \u03C3\u00B2/n, where \u03C3\u00B2 is the population variance and n is the sample size.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945846-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Equal to the population variance","OptionFeedback":""},{"Weight":0,"Text":"Equal to the sample variance","OptionFeedback":""},{"Weight":100,"Text":"Equal to the population variance divided by the sample size","OptionFeedback":""},{"Weight":0,"Text":"Equal to the population variance multiplied by the sample size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q037","Type":"MC","Title":"Question 37","QuestionText":"Which of the following is an incorrect interpretation of a 95% confidence interval for a population mean?","Hint":null,"Feedback":"The incorrect interpretation is that there is a 95% probability the population mean falls within the specific interval. In frequentist statistics, the population mean is fixed (not random), so it either is or isn\u0027t in the interval (with 100% or 0% probability).","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945849-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"We are 95% confident that the interval contains the population mean","OptionFeedback":""},{"Weight":0,"Text":"About 95% of similarly constructed intervals would contain the population mean","OptionFeedback":""},{"Weight":100,"Text":"There is a 95% probability that the population mean falls within this specific interval","OptionFeedback":""},{"Weight":0,"Text":"If we repeated the study many times, about 95% of the resulting intervals would contain the population mean","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q038","Type":"MC","Title":"Question 38","QuestionText":"If the sample size is quadrupled, what happens to the width of a confidence interval (assuming everything else remains constant)?","Hint":null,"Feedback":"The width of a confidence interval is proportional to 1/\u221An. If n is quadrupled, the width is reduced by a factor of 1/\u221A4 = 1/2.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945851-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It increases by a factor of 2","OptionFeedback":""},{"Weight":0,"Text":"It decreases by a factor of 2","OptionFeedback":""},{"Weight":100,"Text":"It decreases by a factor of 2","OptionFeedback":""},{"Weight":0,"Text":"It decreases by a factor of 4","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q039","Type":"MC","Title":"Question 39","QuestionText":"A researcher wants to estimate a population mean with a margin of error of no more than 5 units with 95% confidence. The population standard deviation is 20. What minimum sample size is needed?","Hint":null,"Feedback":"n = (1.96*20/5)\u00B2 = (7.84)\u00B2 = 61.47, rounded up to 62.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945854-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"16","OptionFeedback":""},{"Weight":100,"Text":"62","OptionFeedback":""},{"Weight":0,"Text":"154","OptionFeedback":""},{"Weight":0,"Text":"384","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q040","Type":"MC","Title":"Question 40","QuestionText":"For which of the following would you need the LARGEST sample size for the Central Limit Theorem to apply well?","Hint":null,"Feedback":"A highly right-skewed distribution with outliers deviates most strongly from normality, requiring the largest sample size for the sampling distribution to be approximately normal.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945857-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A normal distribution","OptionFeedback":""},{"Weight":0,"Text":"A uniform distribution","OptionFeedback":""},{"Weight":0,"Text":"A slightly right-skewed distribution","OptionFeedback":""},{"Weight":100,"Text":"A highly right-skewed distribution with outliers","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q041","Type":"MC","Title":"Question 41","QuestionText":"What is the critical value for a 90% confidence interval of a population mean?","Hint":null,"Feedback":"For a 90% confidence interval, we need the z-score with 5% in each tail, so z = 1.645.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945859-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"1.28","OptionFeedback":""},{"Weight":100,"Text":"1.645","OptionFeedback":""},{"Weight":0,"Text":"1.96","OptionFeedback":""},{"Weight":0,"Text":"2.576","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q042","Type":"MC","Title":"Question 42","QuestionText":"A sample of 64 observations has a mean of 50 and a standard deviation of 8. What is the width of a 95% confidence interval for the population mean?","Hint":null,"Feedback":"The margin of error is 1.96*8/\u221A64 = 1.96*8/8 = 1.96, so the width is 2*1.96 = 3.92.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945862-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"\u00B11.96","OptionFeedback":""},{"Weight":0,"Text":"\u00B12","OptionFeedback":""},{"Weight":100,"Text":"\u00B11.96","OptionFeedback":""},{"Weight":0,"Text":"\u00B13.92","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q043","Type":"MC","Title":"Question 43","QuestionText":"A researcher wants to estimate a population proportion with a margin of error of no more than 0.04 with 95% confidence. No prior information about the proportion is available. What minimum sample size is needed?","Hint":null,"Feedback":"With no prior information, we use p = 0.5 for maximum variance: n = (1.96\u00B2*0.5*0.5)/0.04\u00B2 = 0.9604/0.0016 = 600.25, rounded up to 601.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945864-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"384","OptionFeedback":""},{"Weight":100,"Text":"601","OptionFeedback":""},{"Weight":0,"Text":"1067","OptionFeedback":""},{"Weight":0,"Text":"2401","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q044","Type":"MC","Title":"Question 44","QuestionText":"In which situation would the sampling distribution of a sample proportion NOT be approximately normal?","Hint":null,"Feedback":"For the sample size of 20 and proportion of 0.05, np = 20*0.05 = 1, which is less than 10, so the normal approximation would not work well.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945867-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The sample size is 50 and the population proportion is 0.5","OptionFeedback":""},{"Weight":0,"Text":"The sample size is 100 and the population proportion is 0.3","OptionFeedback":""},{"Weight":100,"Text":"The sample size is 20 and the population proportion is 0.05","OptionFeedback":""},{"Weight":0,"Text":"The sample size is 200 and the population proportion is 0.1","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q045","Type":"MC","Title":"Question 45","QuestionText":"If the standard error of the mean for a sample of size 25 is 2, what would be the standard error for a sample of size 100 from the same population?","Hint":null,"Feedback":"If SE\u2081 = \u03C3/\u221An\u2081 = 2 for n\u2081 = 25, then SE\u2082 = \u03C3/\u221An\u2082 = \u03C3/\u221A100 = \u03C3/10. Since \u03C3 = 2*\u221A25 = 2*5 = 10, SE\u2082 = 10/10 = 1.","TopicTitle":"Module 6 Quiz - Sampling","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:30.4945869-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"0.5","OptionFeedback":""},{"Weight":100,"Text":"1","OptionFeedback":""},{"Weight":0,"Text":"4","OptionFeedback":""},{"Weight":0,"Text":"8","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
