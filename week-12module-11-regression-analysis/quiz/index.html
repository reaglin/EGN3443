  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Week_12_Module_11_-_Regression_Analysis","CourseName":"EGN3443 Prob and Stats for Engineers","LastModified":"2026-08-24T17:26:31.0944151-04:00","NextQuestionNumber":36,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is the primary purpose of the least squares method in regression analysis?","Hint":null,"Feedback":"The least squares method minimizes the sum of squared residuals (the differences between observed and predicted values), which is why it\u0027s called \u0027least squares\u0027","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.094406-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To minimize the sum of squared differences between observed values and predicted values","OptionFeedback":""},{"Weight":0,"Text":"To maximize the correlation between variables","OptionFeedback":""},{"Weight":0,"Text":"To equalize the variance of residuals","OptionFeedback":""},{"Weight":0,"Text":"To minimize the absolute differences between observed values and predicted values","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What does the homoscedasticity assumption in regression analysis refer to?","Hint":null,"Feedback":"Homoscedasticity means that the variance of the error terms is constant across all values of the independent variables, creating an even \u0027scatter\u0027 of residuals","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944065-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The variance of errors is constant across all levels of the independent variables","OptionFeedback":""},{"Weight":0,"Text":"The mean of errors is zero","OptionFeedback":""},{"Weight":0,"Text":"The errors are normally distributed","OptionFeedback":""},{"Weight":0,"Text":"The independent variables are not correlated with each other","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What does an R-squared value of 0.75 in a regression model indicate?","Hint":null,"Feedback":"An R-squared value of 0.75 means that 75% of the variance in the dependent variable can be explained by the independent variables in the model","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944068-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"75% of the variation in the dependent variable is explained by the independent variables","OptionFeedback":""},{"Weight":0,"Text":"The correlation between the dependent and independent variables is 0.75","OptionFeedback":""},{"Weight":0,"Text":"The model makes 75% fewer errors than using the mean","OptionFeedback":""},{"Weight":0,"Text":"The p-value of the regression is 0.75","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What is the primary effect of severe multicollinearity in a regression model?","Hint":null,"Feedback":"Severe multicollinearity inflates the standard errors of regression coefficients, making them less precise and potentially making significant variables appear insignificant","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.094407-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Inflated standard errors of regression coefficients","OptionFeedback":""},{"Weight":0,"Text":"Biased coefficient estimates","OptionFeedback":""},{"Weight":0,"Text":"Decreased overall model fit (R-squared)","OptionFeedback":""},{"Weight":0,"Text":"Heteroscedasticity in the error terms","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"In a simple linear regression model, Y = 2 \u002B 3X, what does the coefficient 3 represent?","Hint":null,"Feedback":"The slope coefficient (3) indicates that for each one-unit increase in the independent variable X, the dependent variable Y increases by 3 units on average","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944072-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"For each one-unit increase in X, Y increases by 3 units on average","OptionFeedback":""},{"Weight":0,"Text":"The value of Y when X equals 3","OptionFeedback":""},{"Weight":0,"Text":"The correlation between X and Y is 3","OptionFeedback":""},{"Weight":0,"Text":"Y is 3 times larger than X","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"What is the independence assumption in regression analysis?","Hint":null,"Feedback":"The independence assumption states that the error terms (residuals) in the regression model are not correlated with each other, which is particularly important in time series data","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944077-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The error terms are not correlated with each other","OptionFeedback":""},{"Weight":0,"Text":"The independent variables are not correlated with each other","OptionFeedback":""},{"Weight":0,"Text":"The dependent variable is independent of the error term","OptionFeedback":""},{"Weight":0,"Text":"The independent variables are not correlated with the error term","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"If a regression coefficient has a p-value of 0.03, what can be concluded at a significance level of 0.05?","Hint":null,"Feedback":"Since the p-value (0.03) is less than the significance level (0.05), we can reject the null hypothesis and conclude that the coefficient is statistically significant","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944079-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The coefficient is statistically significant and the null hypothesis can be rejected","OptionFeedback":""},{"Weight":0,"Text":"The coefficient is not statistically significant and the null hypothesis cannot be rejected","OptionFeedback":""},{"Weight":0,"Text":"There is a 3% chance that the independent variable affects the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The coefficient explains 3% of the variation in the dependent variable","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What pattern in residual data would suggest heteroscedasticity?","Hint":null,"Feedback":"A funnel or fan shape in residual plots indicates that the variance of errors changes across the range of predicted values, violating the homoscedasticity assumption","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944081-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A funnel or fan shape when plotting residuals against fitted values","OptionFeedback":""},{"Weight":0,"Text":"A random scatter with no discernible pattern","OptionFeedback":""},{"Weight":0,"Text":"A straight line when plotting residuals against fitted values","OptionFeedback":""},{"Weight":0,"Text":"Residuals that form a normal distribution","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What does a large standard error for a regression coefficient indicate?","Hint":null,"Feedback":"A large standard error indicates that the coefficient estimate is less precise, meaning there is more uncertainty in the estimated value","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944083-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The coefficient estimate is less precise","OptionFeedback":""},{"Weight":0,"Text":"The coefficient estimate is biased","OptionFeedback":""},{"Weight":0,"Text":"The variable has a stronger effect on the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The variable must be removed from the model","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"Why is adjusted R-squared often preferred over regular R-squared when comparing models?","Hint":null,"Feedback":"Adjusted R-squared adjusts for the number of predictors in the model, penalizing the addition of variables that don\u0027t add significant explanatory power","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944087-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"It penalizes the addition of predictors that don\u0027t improve the model fit significantly","OptionFeedback":""},{"Weight":0,"Text":"It always provides a higher value than regular R-squared","OptionFeedback":""},{"Weight":0,"Text":"It handles outliers better than regular R-squared","OptionFeedback":""},{"Weight":0,"Text":"It accounts for heteroscedasticity in the model","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What does the linearity assumption in regression analysis mean?","Hint":null,"Feedback":"The linearity assumption states that the relationship between the independent variables and the dependent variable is linear, meaning it can be represented by a straight line","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944089-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The relationship between the independent variables and the dependent variable is linear","OptionFeedback":""},{"Weight":0,"Text":"All variables must be measured on a linear scale","OptionFeedback":""},{"Weight":0,"Text":"The independent variables must be linearly related to each other","OptionFeedback":""},{"Weight":0,"Text":"The residuals must fall on a straight line","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"How do outliers typically affect least squares regression estimates?","Hint":null,"Feedback":"Outliers can have a large influence on least squares estimates because the method minimizes squared deviations, giving more weight to points far from the line","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.094409-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"They can pull the regression line toward them, potentially distorting coefficient estimates","OptionFeedback":""},{"Weight":0,"Text":"They have no effect on coefficient estimates due to the properties of least squares","OptionFeedback":""},{"Weight":0,"Text":"They only affect the intercept but not the slope coefficients","OptionFeedback":""},{"Weight":0,"Text":"They always reduce the R-squared value of the model","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"Why is the normality assumption important in regression analysis?","Hint":null,"Feedback":"The normality assumption (that residuals are normally distributed) is important for valid hypothesis testing and confidence interval construction, particularly in small samples","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944092-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"It enables valid hypothesis testing and confidence interval construction","OptionFeedback":""},{"Weight":0,"Text":"It prevents multicollinearity among independent variables","OptionFeedback":""},{"Weight":0,"Text":"It ensures the model will have a high R-squared value","OptionFeedback":""},{"Weight":0,"Text":"It guarantees the independence of variables in the model","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What regression assumption does the Durbin-Watson test examine?","Hint":null,"Feedback":"The Durbin-Watson test examines whether there is autocorrelation in the residuals, which would violate the independence assumption","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944094-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Independence of error terms (no autocorrelation)","OptionFeedback":""},{"Weight":0,"Text":"Normality of error terms","OptionFeedback":""},{"Weight":0,"Text":"Homoscedasticity of error terms","OptionFeedback":""},{"Weight":0,"Text":"Linearity of the relationship between variables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"What does a Variance Inflation Factor (VIF) value of 8 for a predictor variable suggest?","Hint":null,"Feedback":"A VIF of 8 indicates that the variance of the coefficient estimate is 8 times larger than it would be if the variable was uncorrelated with other predictors, suggesting multicollinearity issues","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944095-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Moderate to serious multicollinearity concerns for that variable","OptionFeedback":""},{"Weight":0,"Text":"The variable is 8 times more important than other predictors","OptionFeedback":""},{"Weight":0,"Text":"The variable explains 8% of the variation in the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The variable should be transformed by taking its logarithm","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"What does Cook\u0027s Distance measure in regression diagnostics?","Hint":null,"Feedback":"Cook\u0027s Distance measures the influence of each observation, identifying data points that have a large effect on the regression results when removed","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944097-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The influence of each observation on the regression results","OptionFeedback":""},{"Weight":0,"Text":"The distance between observed values and the regression line","OptionFeedback":""},{"Weight":0,"Text":"The correlation between independent variables","OptionFeedback":""},{"Weight":0,"Text":"The normality of residuals","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"In multiple regression, what does a partial regression coefficient represent?","Hint":null,"Feedback":"A partial regression coefficient represents the change in the dependent variable associated with a one-unit change in an independent variable while holding all other independent variables constant","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944099-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The effect of one independent variable while holding all other independent variables constant","OptionFeedback":""},{"Weight":0,"Text":"The total effect of all independent variables on the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The correlation between the independent variable and the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The proportion of variance explained by one independent variable","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What does a statistically significant F-statistic in a regression model indicate?","Hint":null,"Feedback":"A significant F-statistic indicates that at least one of the independent variables has a statistically significant relationship with the dependent variable, rejecting the null hypothesis that all coefficients are zero","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944102-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"At least one of the independent variables has a significant relationship with the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"All independent variables have significant relationships with the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The model explains a large portion of the variance in the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The model satisfies all regression assumptions","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"What does the residual standard error (RSE) in regression analysis represent?","Hint":null,"Feedback":"The residual standard error represents the average amount that the observed values deviate from the fitted values, serving as a measure of model fit","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944103-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The average distance that the observed values fall from the regression line","OptionFeedback":""},{"Weight":0,"Text":"The standard deviation of the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The standard deviation of the independent variables","OptionFeedback":""},{"Weight":0,"Text":"The probability that the model is correct","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What is another name for the R-squared value in regression analysis?","Hint":null,"Feedback":"R-squared is also called the coefficient of determination because it determines the proportion of variance in the dependent variable that is predictable from the independent variables","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944105-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Coefficient of determination","OptionFeedback":""},{"Weight":0,"Text":"Correlation coefficient","OptionFeedback":""},{"Weight":0,"Text":"Standard error of estimate","OptionFeedback":""},{"Weight":0,"Text":"Coefficient of variation","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What does the \u0027zero conditional mean\u0027 assumption in regression analysis state?","Hint":null,"Feedback":"The zero conditional mean assumption states that the expected value of the error term, given any value of the independent variables, is zero, which implies the model form is correctly specified","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944107-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The expected value of the error term given any value of the independent variables is zero","OptionFeedback":""},{"Weight":0,"Text":"The mean value of all variables should be zero before analysis","OptionFeedback":""},{"Weight":0,"Text":"The intercept term should equal zero","OptionFeedback":""},{"Weight":0,"Text":"The correlation between variables should be zero","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"If a 95% confidence interval for a regression coefficient is [0.2, 0.8], what is the correct interpretation?","Hint":null,"Feedback":"A 95% confidence interval means that if we were to take many samples and construct a confidence interval for each sample, 95% of those intervals would contain the true parameter value","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944108-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"We are 95% confident that the true value of the coefficient falls between 0.2 and 0.8","OptionFeedback":""},{"Weight":0,"Text":"95% of the coefficient values in the sample fall between 0.2 and 0.8","OptionFeedback":""},{"Weight":0,"Text":"The coefficient has a 95% chance of being significant","OptionFeedback":""},{"Weight":0,"Text":"The coefficient explains between 20% and 80% of the variation in Y","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What does endogeneity in regression analysis refer to?","Hint":null,"Feedback":"Endogeneity occurs when an independent variable is correlated with the error term, often due to omitted variables, measurement error, or simultaneity","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.094411-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The error term is correlated with one or more independent variables","OptionFeedback":""},{"Weight":0,"Text":"The dependent variable is correlated with the error term","OptionFeedback":""},{"Weight":0,"Text":"Two or more independent variables are correlated with each other","OptionFeedback":""},{"Weight":0,"Text":"The variables in the model are not normally distributed","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What is the primary advantage of using standardized regression coefficients?","Hint":null,"Feedback":"Standardized coefficients (beta coefficients) convert all variables to the same scale, enabling direct comparison of their relative effects on the dependent variable","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944112-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"They allow for direct comparison of the relative importance of independent variables measured in different units","OptionFeedback":""},{"Weight":0,"Text":"They eliminate multicollinearity from the regression model","OptionFeedback":""},{"Weight":0,"Text":"They ensure that all regression assumptions are met","OptionFeedback":""},{"Weight":0,"Text":"They correct for heteroscedasticity in the error terms","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"What is the primary purpose of the Chow test in regression analysis?","Hint":null,"Feedback":"The Chow test determines whether the coefficients in a regression model are the same across different subgroups or time periods, testing for structural breaks","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944114-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To test for structural breaks or differences in regression coefficients between subgroups","OptionFeedback":""},{"Weight":0,"Text":"To test for the normality of residuals","OptionFeedback":""},{"Weight":0,"Text":"To test for multicollinearity among independent variables","OptionFeedback":""},{"Weight":0,"Text":"To test for heteroscedasticity in the error terms","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"In a regression model, what does the intercept coefficient represent?","Hint":null,"Feedback":"The intercept represents the expected value of the dependent variable when all independent variables are zero, though this may not always be meaningful in practice","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944115-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The expected value of the dependent variable when all independent variables equal zero","OptionFeedback":""},{"Weight":0,"Text":"The mean value of the dependent variable","OptionFeedback":""},{"Weight":0,"Text":"The regression line\u0027s angle with the x-axis","OptionFeedback":""},{"Weight":0,"Text":"The minimum value of the dependent variable","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What does including an interaction term (X\u2081\u00D7X\u2082) in a regression model allow?","Hint":null,"Feedback":"An interaction term allows the effect of one independent variable on the dependent variable to differ depending on the value of another independent variable","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944117-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The effect of X\u2081 on Y to vary based on the value of X\u2082","OptionFeedback":""},{"Weight":0,"Text":"X\u2081 and X\u2082 to be uncorrelated with each other","OptionFeedback":""},{"Weight":0,"Text":"The removal of multicollinearity between X\u2081 and X\u2082","OptionFeedback":""},{"Weight":0,"Text":"The model to be more parsimonious","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"What regression assumption does the Breusch-Pagan test examine?","Hint":null,"Feedback":"The Breusch-Pagan test examines whether the variance of the errors is constant (homoscedasticity) or changes with the values of the independent variables","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944118-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Homoscedasticity of error terms","OptionFeedback":""},{"Weight":0,"Text":"Normality of error terms","OptionFeedback":""},{"Weight":0,"Text":"Independence of error terms","OptionFeedback":""},{"Weight":0,"Text":"Linearity of the relationship between evant variables","OptionFeedback":""},{"Weight":0,"Text":"Using too small a sample size for reliable estimates","OptionFeedback":""},{"Weight":0,"Text":"Failing to check for outliers in the data","OptionFeedback":""},{"Weight":0,"Text":"Using variables with measurement error","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What is a primary criticism of stepwise regression methods?","Hint":null,"Feedback":"Stepwise methods have been criticized for biased parameter estimates, incorrect degrees of freedom, and inappropriate p-values due to multiple testing issues","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-08-24T17:26:31.0944123-04:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"They can lead to biased parameter estimates and incorrect degrees of freedom","OptionFeedback":""},{"Weight":0,"Text":"They always select too few variables for the final model","OptionFeedback":""},{"Weight":0,"Text":"They are computationally too intensive for modern computers","OptionFeedback":""},{"Weight":0,"Text":"They require normally distributed variables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"What happens when a relevant variable is omitted from a regression model?","Hint":null,"Feedback":"Omitting a relevant variable can bias the coefficient estimates of included variables if the omitted variable is correlated with both the dependent variable and included independents","TopicTitle":"Module 11 Quiz - Regression","ModuleStudentOutcome
